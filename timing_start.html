<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>START – モンジュニ計測</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700&display=swap');
  :root {
    --bg:#0a0f0a;--surface:#111811;--border:#1a2a1a;
    --accent:#00ff88;--accent2:#ff3366;--warn:#ffaa00;
    --text:#e8f0e8;--text-dim:#5a705a;
    --timer-font:'Bebas Neue',sans-serif;--body-font:'Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--body-font);min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(0,255,136,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,0.03) 1px,transparent 1px);
    background-size:40px 40px;}
  .header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
    border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10;}
  .header-title{font-family:var(--timer-font);font-size:1.3rem;letter-spacing:4px;color:var(--accent);}
  .status-badge{padding:3px 10px;border-radius:20px;font-size:0.65rem;font-weight:700;
    letter-spacing:2px;text-transform:uppercase;border:1px solid currentColor;}
  .status-badge.waiting{color:var(--text-dim);border-color:var(--border);}
  .status-badge.confirm{color:var(--warn);animation:pulse 1s infinite;}
  .status-badge.ready{color:var(--accent);animation:pulse 0.8s infinite;}
  .status-badge.running{color:var(--accent);animation:pulse 0.4s infinite;}
  .status-badge.error{color:var(--accent2);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  .conn-wrap{display:flex;align-items:center;gap:6px;font-size:0.7rem;color:var(--text-dim);}
  .conn-dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);}
  .conn-dot.ok{background:var(--accent);box-shadow:0 0 5px var(--accent);}
  .conn-dot.err{background:var(--accent2);}
  .main{display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px;}

  /* キュー表示 */
  .queue-panel{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:12px 16px;}
  .queue-title{font-size:0.6rem;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;}
  .queue-list{display:flex;flex-direction:column;gap:6px;}
  .queue-item{display:flex;align-items:center;gap:10px;padding:8px 12px;
    background:var(--bg);border:1px solid var(--border);border-radius:8px;}
  .queue-item.active{border-color:var(--accent);background:rgba(0,255,136,0.05);}
  .queue-item.running{border-color:var(--warn);background:rgba(255,170,0,0.05);}
  .queue-num{font-family:var(--timer-font);font-size:1.2rem;color:var(--text-dim);width:20px;}
  .queue-name{flex:1;font-weight:700;font-size:0.9rem;}
  .queue-timer{font-family:var(--timer-font);font-size:1rem;color:var(--warn);}
  .queue-status{font-size:0.65rem;color:var(--text-dim);letter-spacing:1px;}

  /* モード選択 */
  .mode-wrap{width:100%;max-width:440px;}
  .section-label{font-size:0.6rem;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;}
  .mode-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .mode-btn{padding:7px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-dim);font-size:0.75rem;cursor:pointer;
    transition:all 0.2s;font-family:var(--body-font);line-height:1.3;text-align:center;}
  .mode-btn.selected{border-color:var(--accent);color:var(--accent);background:rgba(0,255,136,0.08);}

  /* インターバル */
  .interval-wrap{width:100%;max-width:440px;display:flex;align-items:center;gap:10px;}
  .interval-wrap input[type=range]{flex:1;accent-color:var(--warn);}
  .interval-val{font-family:var(--timer-font);font-size:1.2rem;color:var(--warn);min-width:50px;}

  /* 種目選択 */
  .event-wrap{width:100%;max-width:440px;}
  .event-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .event-btn{padding:7px 14px;border-radius:20px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-dim);font-size:0.8rem;cursor:pointer;
    transition:all 0.2s;font-family:var(--body-font);}
  .event-btn.selected{border-color:var(--accent);color:var(--accent);background:rgba(0,255,136,0.08);}
  .other-input{width:100%;margin-top:6px;padding:8px 12px;background:var(--surface);
    color:var(--text);border:1px solid var(--accent);border-radius:8px;
    font-family:var(--body-font);font-size:0.9rem;outline:none;display:none;}

  /* NFC */
  .nfc-area{width:100%;max-width:440px;background:var(--surface);border:2px solid var(--border);
    border-radius:14px;padding:20px;text-align:center;transition:all 0.4s;}
  .nfc-area.active{border-color:var(--accent);box-shadow:0 0 20px rgba(0,255,136,0.15);}
  .nfc-area.confirmed{border-color:var(--warn);box-shadow:0 0 20px rgba(255,170,0,0.15);}
  .nfc-icon{font-size:2.5rem;margin-bottom:8px;display:block;animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .nfc-label{font-size:0.75rem;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
  .nfc-instruction{font-size:0.95rem;color:var(--text);font-weight:700;}

  /* 選手確認 */
  .athlete-card{width:100%;max-width:440px;background:var(--surface);border:2px solid var(--warn);
    border-radius:10px;padding:14px 16px;display:none;}
  .athlete-card.visible{display:block;}
  .athlete-card-header{font-size:0.6rem;letter-spacing:3px;color:var(--warn);text-transform:uppercase;margin-bottom:6px;}
  .athlete-card-name{font-size:1.6rem;font-weight:700;color:var(--text);margin-bottom:3px;}
  .athlete-card-meta{font-size:0.75rem;color:var(--text-dim);margin-bottom:12px;}
  .confirm-btns{display:flex;gap:8px;}
  .btn{flex:1;padding:11px;border-radius:8px;border:none;font-family:var(--body-font);
    font-size:0.85rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
  .btn-ok{background:var(--accent);color:#000;}
  .btn-ng{background:transparent;color:var(--accent2);border:1px solid var(--accent2);}

  /* コール音ボタン */
  .call-btn-wrap{width:100%;max-width:440px;}
  .btn-call{width:100%;padding:18px;border-radius:10px;border:none;
    font-family:var(--timer-font);font-size:1.8rem;letter-spacing:5px;
    background:var(--warn);color:#000;cursor:pointer;transition:all 0.2s;
    box-shadow:0 0 15px rgba(255,170,0,0.2);}
  .btn-call:hover{filter:brightness(1.1);}
  .btn-call:active{transform:scale(0.97);}
  .btn-call:disabled{opacity:0.3;cursor:not-allowed;}

  /* カメラ */
  .camera-section{width:100%;max-width:440px;}
  .camera-container{width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;
    overflow:hidden;position:relative;border:1px solid var(--border);}
  #camera-feed{width:100%;height:100%;object-fit:cover;}
  .detect-line{position:absolute;top:0;bottom:0;left:50%;width:2px;
    background:rgba(255,170,0,0.8);transform:translateX(-50%);pointer-events:none;display:none;}
  .camera-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(10,15,10,0.85);border-radius:8px;font-size:0.85rem;
    color:var(--text-dim);text-align:center;flex-direction:column;gap:6px;}
  .camera-overlay.hidden{display:none;}

  /* 感度 */
  .sensitivity-wrap{display:flex;align-items:center;gap:8px;font-size:0.7rem;
    color:var(--text-dim);width:100%;max-width:440px;}
  .sensitivity-wrap input[type=range]{flex:1;accent-color:var(--warn);}

  /* ボタン行 */
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:440px;}
  .btn-sm{padding:9px 18px;border-radius:6px;border:none;font-family:var(--body-font);
    font-size:0.8rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
  .btn-primary{background:var(--accent);color:#000;}
  .btn-danger{background:transparent;color:var(--accent2);border:1px solid var(--accent2);}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}

  /* エラー */
  .error-msg{background:rgba(255,51,102,0.1);border:1px solid var(--accent2);border-radius:8px;
    padding:8px 14px;font-size:0.8rem;color:var(--accent2);text-align:center;
    width:100%;max-width:440px;display:none;}
  .error-msg.visible{display:block;}

  /* ゴール完了トースト */
  .finish-toast{position:fixed;top:65px;left:50%;transform:translateX(-50%) translateY(-20px);
    background:var(--accent);color:#000;font-family:var(--timer-font);font-size:1.1rem;
    letter-spacing:3px;padding:10px 24px;border-radius:28px;opacity:0;
    transition:all 0.4s ease;pointer-events:none;z-index:100;}
  .finish-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 自動モードカウントダウン */
  .auto-countdown{width:100%;max-width:440px;text-align:center;display:none;}
  .auto-countdown.visible{display:block;}
  .countdown-num{font-family:var(--timer-font);font-size:3rem;color:var(--warn);letter-spacing:3px;}
  .countdown-label{font-size:0.7rem;color:var(--text-dim);letter-spacing:2px;}

  canvas{display:none;}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">🚀 START</div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="conn-wrap">
      <span class="conn-dot" id="conn-dot"></span>
      <span id="conn-label">接続中...</span>
    </div>
    <span class="status-badge waiting" id="status-badge">WAITING</span>
  </div>
</div>

<div class="finish-toast" id="finish-toast"></div>

<div class="main">

  <!-- キュー表示 -->
  <div class="queue-panel">
    <div class="queue-title">計測キュー（最大4人）</div>
    <div class="queue-list" id="queue-list">
      <div style="color:var(--text-dim);font-size:0.8rem;padding:4px;">待機中...</div>
    </div>
  </div>

  <!-- スタートモード -->
  <div class="mode-wrap">
    <div class="section-label">スタートモード</div>
    <div class="mode-btns">
      <button class="mode-btn selected" data-mode="camera">📷 カメラのみ</button>
      <button class="mode-btn" data-mode="sound">🔔 音のみ</button>
      <button class="mode-btn" data-mode="camera_fallback">📷+🔔 カメラ優先</button>
      <button class="mode-btn" data-mode="both">⚡ どちらでも</button>
      <button class="mode-btn" data-mode="auto">🤖 自動インターバル</button>
    </div>
  </div>

  <!-- インターバル設定（自動モード時） -->
  <div class="interval-wrap" id="interval-wrap" style="display:none;">
    <div class="section-label" style="margin-bottom:0;white-space:nowrap;">間隔</div>
    <input type="range" id="interval-slider" min="5" max="30" value="10">
    <div class="interval-val"><span id="interval-val">10</span>秒</div>
  </div>

  <!-- 種目選択 -->
  <div class="event-wrap">
    <div class="section-label">種目</div>
    <div class="event-btns">
      <button class="event-btn selected" data-event="50m走">50m走</button>
      <button class="event-btn" data-event="100m走">100m走</button>
      <button class="event-btn" data-event="立ち幅跳び">立ち幅跳び</button>
      <button class="event-btn" data-event="__other__">その他</button>
    </div>
    <input type="text" id="other-event-input" class="other-input" placeholder="種目名を入力（例：障害物走）">
  </div>

  <!-- NFC待機 -->
  <div class="nfc-area" id="nfc-area">
    <span class="nfc-icon">📡</span>
    <div class="nfc-label">NFC</div>
    <div class="nfc-instruction" id="nfc-instruction">カードをかざして選手登録</div>
  </div>

  <!-- 選手確認 -->
  <div class="athlete-card" id="athlete-card">
    <div class="athlete-card-header">✅ 選手確認</div>
    <div class="athlete-card-name" id="athlete-name">—</div>
    <div class="athlete-card-meta" id="athlete-meta">—</div>
    <div class="confirm-btns">
      <button class="btn btn-ok" id="btn-ok">▶ キューに追加</button>
      <button class="btn btn-ng" id="btn-ng">✕ 違う</button>
    </div>
  </div>

  <!-- コール音ボタン -->
  <div class="call-btn-wrap">
    <button class="btn-call" id="btn-call" disabled>🔔 コール音を鳴らす</button>
  </div>

  <!-- 自動モードカウントダウン -->
  <div class="auto-countdown" id="auto-countdown">
    <div class="countdown-label">次のコールまで</div>
    <div class="countdown-num" id="countdown-num">--</div>
  </div>

  <!-- エラー -->
  <div class="error-msg" id="error-msg"></div>

  <!-- カメラ -->
  <div class="camera-section" id="camera-section">
    <div class="camera-container">
      <video id="camera-feed" autoplay playsinline muted></video>
      <canvas id="detect-canvas"></canvas>
      <div class="detect-line" id="detect-line"></div>
      <div class="camera-overlay" id="camera-overlay">
        <span style="font-size:1.3rem;">📷</span>
        カメラを起動してください
      </div>
    </div>
  </div>

  <!-- 感度 -->
  <div class="sensitivity-wrap" id="sensitivity-wrap">
    <span>感度</span>
    <input type="range" id="sensitivity" min="10" max="80" value="30">
    <span id="sens-val">30</span>
  </div>

  <!-- ボタン -->
  <div class="btn-row">
    <button class="btn-sm btn-primary" id="btn-camera">📷 カメラ起動</button>
    <button class="btn-sm btn-danger" id="btn-cancel-all" style="display:none;">❌ 全リセット</button>
    <button class="btn-sm btn-ghost" id="btn-noone">👤 nooneで追加</button>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyD8o8tRvsuqxr012DyR10j_DOY0dQ0uL7w",
  authDomain:"monjuni-timing.firebaseapp.com",
  databaseURL:"https://monjuni-timing-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"monjuni-timing",
  storageBucket:"monjuni-timing.firebasestorage.app",
  messagingSenderId:"705263409750",
  appId:"1:705263409750:web:cc8e7ee0700887680cb9f7"
};

const MONJUNI_GAS = "https://script.google.com/macros/s/AKfycbyVH4yXtC0PsG4gwbWITAnsMFUdwvMSij2hNsZ9z4bfRTRS0RxHzqvZZeaN3AVIEOte/exec";
const SOUND_URL   = "https://mtjuni.github.io/monjuni/start_beep.wav";
const START_TIME_SEC = 9.9; // ピーーーーのタイミング

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const queueRef = ref(db, 'timing/queue');
const modeRef  = ref(db, 'timing/mode');

// DOM
const statusBadge    = document.getElementById('status-badge');
const nfcArea        = document.getElementById('nfc-area');
const nfcInstruction = document.getElementById('nfc-instruction');
const athleteCard    = document.getElementById('athlete-card');
const athleteNameEl  = document.getElementById('athlete-name');
const athleteMetaEl  = document.getElementById('athlete-meta');
const errorMsg       = document.getElementById('error-msg');
const connDot        = document.getElementById('conn-dot');
const connLabel      = document.getElementById('conn-label');
const finishToast    = document.getElementById('finish-toast');
const cameraOverlay  = document.getElementById('camera-overlay');
const detectLine     = document.getElementById('detect-line');
const sensitivity    = document.getElementById('sensitivity');
const sensVal        = document.getElementById('sens-val');
const btnOk          = document.getElementById('btn-ok');
const btnNg          = document.getElementById('btn-ng');
const btnCall        = document.getElementById('btn-call');
const btnCamera      = document.getElementById('btn-camera');
const btnCancelAll   = document.getElementById('btn-cancel-all');
const btnNoone       = document.getElementById('btn-noone');
const video          = document.getElementById('camera-feed');
const canvas         = document.getElementById('detect-canvas');
const ctx            = canvas.getContext('2d');
const otherInput     = document.getElementById('other-event-input');
const queueList      = document.getElementById('queue-list');
const intervalWrap   = document.getElementById('interval-wrap');
const intervalSlider = document.getElementById('interval-slider');
const intervalValEl  = document.getElementById('interval-val');
const autoCountdown  = document.getElementById('auto-countdown');
const countdownNum   = document.getElementById('countdown-num');
const cameraSection  = document.getElementById('camera-section');
const sensitivityWrap= document.getElementById('sensitivity-wrap');

// 状態
let queue          = []; // 最大4人
let currentAthlete = null;
let selectedEvent  = '50m走';
let selectedMode   = 'camera';
let cameraReady    = false;
let detectInterval = null;
let prevPixels     = null;
let audioCtx       = null;
let audioBuffer    = null;
let autoTimer      = null;
let autoCountTimer = null;
let intervalSec    = 10;
let isPlaying      = false;

// 音源読み込み
async function loadAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const res = await fetch(SOUND_URL);
    const buf = await res.arrayBuffer();
    audioBuffer = await audioCtx.decodeAudioData(buf);
  } catch(e) {
    console.warn('音源読み込みエラー:', e);
  }
}
loadAudio();

// コール音再生
function playCallSound(onStart) {
  if (!audioBuffer || !audioCtx || isPlaying) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  isPlaying = true;
  const source = audioCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(audioCtx.destination);
  source.start(0);

  // 9.9秒後にスタート処理
  setTimeout(() => {
    if (onStart) onStart();
    isPlaying = false;
  }, START_TIME_SEC * 1000);

  source.onended = () => { isPlaying = false; };
}

// Firebase監視
onValue(queueRef, (snapshot) => {
  connDot.classList.add('ok');
  connDot.classList.remove('err');
  connLabel.textContent = 'Firebase接続済';
  const data = snapshot.val();
  if (data) {
    queue = Array.isArray(data) ? data : Object.values(data);
  } else {
    queue = [];
  }
  renderQueue();
  updateUI();
}, () => {
  connDot.classList.remove('ok');
  connDot.classList.add('err');
  connLabel.textContent = '接続エラー';
});

// コントローラーからのコール指示を監視
const callRef = ref(db, 'timing/callSignal');
onValue(callRef, (snapshot) => {
  const sig = snapshot.val();
  if (sig && sig.play && !isPlaying) {
    triggerCall();
    // シグナルをリセット
    set(callRef, { play: false });
  }
});

// モード選択
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMode = btn.dataset.mode;
    updateModeUI();
    set(modeRef, { mode: selectedMode });
  });
});

function updateModeUI() {
  const isAuto   = selectedMode === 'auto';
  const isCamera = ['camera','camera_fallback','both'].includes(selectedMode);
  const isSound  = ['sound','camera_fallback','both','auto'].includes(selectedMode);

  intervalWrap.style.display    = isAuto ? 'flex' : 'none';
  cameraSection.style.display   = isCamera ? 'block' : 'none';
  sensitivityWrap.style.display = isCamera ? 'flex' : 'none';
  btnCall.disabled               = isAuto || queue.length === 0;

  if (isAuto) {
    startAutoMode();
  } else {
    stopAutoMode();
  }
}

// 種目選択
document.querySelectorAll('.event-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.event-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    if (btn.dataset.event === '__other__') {
      otherInput.style.display = 'block';
      otherInput.focus();
      selectedEvent = otherInput.value.trim() || 'その他';
    } else {
      otherInput.style.display = 'none';
      selectedEvent = btn.dataset.event;
    }
  });
});
otherInput.addEventListener('input', () => {
  selectedEvent = otherInput.value.trim() || 'その他';
});

// インターバル設定
intervalSlider.addEventListener('input', () => {
  intervalSec = parseInt(intervalSlider.value);
  intervalValEl.textContent = intervalSec;
});

// NFC読み取り
async function startNFCScan() {
  if (!('NDEFReader' in window)) {
    showManualInput();
    return;
  }
  try {
    const ndef = new NDEFReader();
    await ndef.scan();
    nfcArea.classList.add('active');
    nfcInstruction.textContent = 'カードをかざして選手登録';
    ndef.addEventListener('reading', ({ serialNumber }) => {
      if (queue.length >= 4) {
        showError('キューが満員です（最大4人）');
        return;
      }
      lookupAthleteByNFC(serialNumber.toUpperCase().replace(/:/g,''));
    });
  } catch(e) {
    showManualInput();
  }
}

function lookupAthleteByNFC(nfcUID) {
  nfcInstruction.textContent = '選手情報取得中...';
  window._pendingNfcUID = nfcUID;
  const script = document.createElement('script');
  script.src = `${MONJUNI_GAS}?action=getMembers&callback=onMembersForNFC`;
  document.head.appendChild(script);
  setTimeout(() => { if (!currentAthlete) { showError('タイムアウト'); resetNFCArea(); } }, 8000);
}

window.onMembersForNFC = function(data) {
  const members = data.members || [];
  const uid = (window._pendingNfcUID || '').toUpperCase();
  const found = members.find(m => m.nfcId && m.nfcId.toUpperCase() === uid);
  if (!found) { showError('登録されていないカードです'); resetNFCArea(); return; }
  currentAthlete = { id: found.nfcId, name: found.name, grade: found.grade, nfcId: found.nfcId };
  showAthleteConfirm(currentAthlete);
};

function showManualInput() {
  nfcInstruction.textContent = '選手を選択してください';
  const script = document.createElement('script');
  script.src = `${MONJUNI_GAS}?action=getMembers&callback=onMembersLoaded`;
  document.head.appendChild(script);
}

window.onMembersLoaded = function(data) {
  const members = data.members || [];
  if (!members.length) return;
  const select = document.createElement('select');
  select.style.cssText = 'width:100%;padding:8px;margin-top:8px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;font-family:var(--body-font);font-size:0.9rem;';
  select.innerHTML = '<option value="">-- 選手を選択 --</option>' +
    members.map(m => `<option value="${m.nfcId||m.id}">${m.name}（${m.grade||''}）</option>`).join('');
  select.addEventListener('change', () => {
    const found = members.find(m => (m.nfcId||m.id) === select.value);
    if (found) {
      currentAthlete = { id: found.nfcId||found.id, name: found.name, grade: found.grade, nfcId: found.nfcId };
      showAthleteConfirm(currentAthlete);
    }
  });
  nfcArea.appendChild(select);
};

function showAthleteConfirm(athlete) {
  athleteNameEl.textContent = athlete.name || '—';
  athleteMetaEl.textContent = `${athlete.grade||''}　${selectedEvent}`;
  athleteCard.classList.add('visible');
  nfcArea.classList.add('confirmed');
  showError(false);
}

// キューに追加
btnOk.addEventListener('click', () => {
  if (!currentAthlete || queue.length >= 4) return;
  addToQueue(currentAthlete);
  athleteCard.classList.remove('visible');
  nfcArea.classList.remove('confirmed','active');
  currentAthlete = null;
  nfcInstruction.textContent = 'カードをかざして選手登録';
  showError(false);
});

btnNg.addEventListener('click', () => {
  athleteCard.classList.remove('visible');
  nfcArea.classList.remove('confirmed','active');
  currentAthlete = null;
  nfcInstruction.textContent = 'カードをかざして選手登録';
  showError(false);
});

// nooneで追加
btnNoone.addEventListener('click', () => {
  if (queue.length >= 4) { showError('キューが満員です（最大4人）'); return; }
  addToQueue({ id: 'noone_' + Date.now(), name: 'noone', grade: '', nfcId: '' });
});

function addToQueue(athlete) {
  const entry = {
    laneId:      queue.length,
    athleteId:   athlete.id || '',
    athleteName: athlete.name,
    grade:       athlete.grade || '',
    nfcId:       athlete.nfcId || '',
    event:       selectedEvent,
    status:      'waiting', // waiting / started / finished
    startTime:   null,
    addedAt:     Date.now()
  };
  queue.push(entry);
  saveQueue();
  btnCall.disabled = false;
  updateUI();
}

function saveQueue() {
  set(queueRef, queue.length > 0 ? queue : null);
}

// コール音ボタン
btnCall.addEventListener('click', () => {
  triggerCall();
});

function triggerCall() {
  if (queue.length === 0) return;
  
  // 次のwaitingの選手を探す
  const nextIdx = queue.findIndex(q => q.status === 'waiting');
  if (nextIdx === -1) return;

  playCallSound(() => {
    // スタート処理
    startAthlete(nextIdx);
  });

  // コール中の表示
  btnCall.textContent = '🔔 コール中...';
  btnCall.disabled = true;
  setTimeout(() => {
    btnCall.textContent = '🔔 コール音を鳴らす';
    btnCall.disabled = false;
  }, START_TIME_SEC * 1000 + 500);
}

function startAthlete(idx) {
  if (!queue[idx]) return;
  queue[idx].status    = 'started';
  queue[idx].startTime = Date.now();
  saveQueue();
  renderQueue();

  // カメラ検知開始（camera/camera_fallback/bothモード）
  if (['camera','camera_fallback','both'].includes(selectedMode) && cameraReady) {
    startCameraDetection(idx);
  }
}

// カメラ起動
btnCamera.addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'environment', width:{ideal:1280}, height:{ideal:720} }
    });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      cameraReady = true;
      cameraOverlay.classList.add('hidden');
      detectLine.style.display = 'block';
    };
    btnCamera.style.display = 'none';
  } catch(e) { showError('カメラエラー: ' + e.message); }
});

// カメラ検知
function startCameraDetection(laneIdx) {
  prevPixels = null;
  detectInterval = setInterval(() => {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const cx = Math.floor(canvas.width / 2);
    const pixels = ctx.getImageData(cx, 0, 1, canvas.height).data;
    if (prevPixels) {
      let diff = 0;
      for (let i = 0; i < pixels.length; i += 4) diff += Math.abs(pixels[i] - prevPixels[i]);
      const avgDiff = diff / (canvas.height * 255);
      if (avgDiff > parseInt(sensitivity.value) / 1000) {
        clearInterval(detectInterval);
        startAthlete(laneIdx);
      }
    }
    prevPixels = new Uint8ClampedArray(pixels);
  }, 33);
}

// 自動インターバルモード
function startAutoMode() {
  stopAutoMode();
  autoCountdown.classList.add('visible');
  btnCancelAll.style.display = 'inline-block';
  runAutoInterval();
}

function runAutoInterval() {
  let remaining = intervalSec;
  countdownNum.textContent = remaining;
  autoCountTimer = setInterval(() => {
    remaining--;
    countdownNum.textContent = remaining;
    if (remaining <= 0) {
      clearInterval(autoCountTimer);
      // nooneとしてキューに追加してコール
      if (queue.length < 4) {
        addToQueue({ id:'noone_'+Date.now(), name:'noone', grade:'', nfcId:'' });
      }
      triggerCall();
      setTimeout(() => runAutoInterval(), START_TIME_SEC * 1000 + 500);
    }
  }, 1000);
}

function stopAutoMode() {
  clearInterval(autoTimer);
  clearInterval(autoCountTimer);
  autoCountdown.classList.remove('visible');
}

// 全リセット
btnCancelAll.addEventListener('click', () => {
  queue = [];
  saveQueue();
  stopAutoMode();
  renderQueue();
  updateUI();
  set(ref(db, 'timing/callSignal'), { play: false });
});

// キュー描画
function renderQueue() {
  if (!queue.length) {
    queueList.innerHTML = '<div style="color:var(--text-dim);font-size:0.8rem;padding:4px;">待機中...</div>';
    return;
  }
  queueList.innerHTML = queue.map((q, i) => {
    const elapsed = q.status === 'started' && q.startTime
      ? formatTime((Date.now() - q.startTime) / 1000)
      : q.status === 'finished' ? formatTime(q.elapsedSec || 0) : '—';
    return `
      <div class="queue-item ${q.status}">
        <span class="queue-num">${i+1}</span>
        <div style="flex:1;">
          <div class="queue-name">${q.athleteName}</div>
          <div class="queue-status">${q.event} · ${q.status.toUpperCase()}</div>
        </div>
        <span class="queue-timer">${elapsed}</span>
        <button onclick="removeFromQueue(${i})" style="background:transparent;border:none;color:var(--accent2);cursor:pointer;font-size:0.8rem;padding:4px;">✕</button>
      </div>
    `;
  }).join('');
}

window.removeFromQueue = function(idx) {
  queue.splice(idx, 1);
  saveQueue();
  renderQueue();
};

// UI更新
function updateUI() {
  const runningCount = queue.filter(q => q.status === 'started').length;
  const waitingCount = queue.filter(q => q.status === 'waiting').length;

  if (runningCount > 0) setStatus('running');
  else if (waitingCount > 0) setStatus('ready');
  else setStatus('waiting');

  btnCall.disabled = queue.filter(q => q.status === 'waiting').length === 0 || selectedMode === 'auto';
  btnCancelAll.style.display = queue.length > 0 ? 'inline-block' : 'none';

  // タイマー更新
  renderQueue();
}

// ゴール完了をFirebaseから受け取る
const finishedRef = ref(db, 'timing/lastFinished');
onValue(finishedRef, (snapshot) => {
  const data = snapshot.val();
  if (!data || !data.athleteName) return;
  showFinishToast(`🏁 ${data.athleteName}  ${formatTime(data.elapsedSec)}`);

  // キューから該当者をfinishedに
  const idx = queue.findIndex(q => q.athleteId === data.athleteId && q.status === 'started');
  if (idx !== -1) {
    queue[idx].status     = 'finished';
    queue[idx].elapsedSec = data.elapsedSec;
    saveQueue();
    renderQueue();
  }

  // 3秒後にfinishedをキューから除去
  setTimeout(() => {
    queue = queue.filter(q => q.status !== 'finished');
    saveQueue();
    renderQueue();
    updateUI();
  }, 3000);
});

function showFinishToast(msg) {
  finishToast.textContent = msg;
  finishToast.classList.add('show');
  setTimeout(() => finishToast.classList.remove('show'), 4000);
}

function resetNFCArea() {
  nfcArea.classList.remove('active','confirmed');
  nfcInstruction.textContent = 'カードをかざして選手登録';
}

function setStatus(s) {
  const labels = { waiting:'WAITING', ready:'READY', running:'RUNNING', error:'ERROR' };
  statusBadge.textContent = labels[s] || s.toUpperCase();
  statusBadge.className = `status-badge ${s}`;
}

function showError(show, msg='') {
  errorMsg.textContent = msg;
  errorMsg.classList.toggle('visible', !!show);
}

function formatTime(sec) {
  if (!sec) return '00.00';
  const s = Math.floor(sec);
  const ms = Math.floor((sec - s) * 100);
  return `${String(s).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
}

sensitivity.addEventListener('input', () => { sensVal.textContent = sensitivity.value; });

// キュータイマー更新
setInterval(() => { if (queue.some(q => q.status === 'started')) renderQueue(); }, 100);

startNFCScan();
setStatus('waiting');
</script>
