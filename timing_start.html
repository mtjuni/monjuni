<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>START – モンジュニ計測</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700&display=swap');

  :root {
    --bg: #0a0f0a;
    --surface: #111811;
    --border: #1a2a1a;
    --accent: #00ff88;
    --accent2: #ff3366;
    --warn: #ffaa00;
    --text: #e8f0e8;
    --text-dim: #5a705a;
    --timer-font: 'Bebas Neue', sans-serif;
    --body-font: 'Noto Sans JP', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body-font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* ヘッダー */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    z-index: 10;
  }

  .header-title {
    font-family: var(--timer-font);
    font-size: 1.4rem;
    letter-spacing: 4px;
    color: var(--accent);
  }

  .status-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 1px solid currentColor;
  }
  .status-badge.waiting  { color: var(--text-dim); border-color: var(--border); }
  .status-badge.confirm  { color: var(--warn); animation: pulse 1s ease-in-out infinite; }
  .status-badge.ready    { color: var(--accent); animation: pulse 0.8s ease-in-out infinite; }
  .status-badge.running  { color: var(--accent); animation: pulse 0.4s ease-in-out infinite; }
  .status-badge.finished { color: var(--accent); }
  .status-badge.error    { color: var(--accent2); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 16px;
    gap: 14px;
    overflow-y: auto;
  }

  /* NFC待機エリア */
  .nfc-area {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    transition: all 0.4s ease;
    position: relative;
    overflow-y: auto;
  }

  .nfc-area.active {
    border-color: var(--accent);
    box-shadow: 0 0 30px rgba(0,255,136,0.15);
  }

  .nfc-area.confirmed {
    border-color: var(--warn);
    box-shadow: 0 0 30px rgba(255,170,0,0.15);
  }

  .nfc-icon {
    font-size: 3rem;
    margin-bottom: 12px;
    display: block;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .nfc-label {
    font-size: 0.85rem;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .nfc-instruction {
    font-size: 1rem;
    color: var(--text);
    font-weight: 700;
  }

  /* 選手確認カード */
  .athlete-card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 2px solid var(--warn);
    border-radius: 12px;
    padding: 16px 20px;
    display: none;
    animation: slide-down 0.4s ease;
  }

  .athlete-card.visible { display: block; }

  @keyframes slide-down {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .athlete-card-header {
    font-size: 0.65rem;
    letter-spacing: 3px;
    color: var(--warn);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .athlete-card-name {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .athlete-card-meta {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  .confirm-btns {
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-family: var(--body-font);
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .btn-ok {
    background: var(--accent);
    color: #000;
  }
  .btn-ok:hover { filter: brightness(1.1); }
  .btn-ok:active { transform: scale(0.97); }

  .btn-ng {
    background: transparent;
    color: var(--accent2);
    border: 1px solid var(--accent2);
  }
  .btn-ng:hover { background: rgba(255,51,102,0.1); }

  .btn-cancel {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    flex: none;
    padding: 10px 20px;
  }

  /* 種目選択 */
  .event-select-wrap {
    width: 100%;
    max-width: 420px;
  }

  .event-select-label {
    font-size: 0.65rem;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .event-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .event-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--body-font);
  }

  .event-btn.selected {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,255,136,0.08);
  }

  /* スタンバイ表示 */
  .standby-wrap {
    width: 100%;
    max-width: 420px;
    text-align: center;
    display: none;
  }

  .standby-wrap.visible { display: block; }

  .standby-name {
    font-family: var(--timer-font);
    font-size: 2.5rem;
    letter-spacing: 4px;
    color: var(--text);
    margin-bottom: 4px;
  }

  .standby-msg {
    font-size: 0.85rem;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-bottom: 16px;
  }

  /* カメラ */
  .camera-section {
    width: 100%;
    max-width: 420px;
  }

  .camera-container {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 8px;
    overflow-y: auto;
    position: relative;
    border: 1px solid var(--border);
  }

  #camera-feed {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .detect-line {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 2px;
    background: rgba(255,170,0,0.8);
    transform: translateX(-50%);
    pointer-events: none;
    display: none;
  }

  .detect-line::before, .detect-line::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: var(--warn);
    border-radius: 50%;
  }
  .detect-line::before { top: 0; }
  .detect-line::after  { bottom: 0; }

  .camera-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10,15,10,0.85);
    border-radius: 8px;
    font-size: 0.9rem;
    color: var(--text-dim);
    text-align: center;
    flex-direction: column;
    gap: 8px;
  }

  .camera-overlay.hidden { display: none; }

  /* 感度 */
  .sensitivity-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.75rem;
    color: var(--text-dim);
    width: 100%;
    max-width: 420px;
  }
  .sensitivity-wrap input[type=range] {
    flex: 1;
    accent-color: var(--warn);
  }

  /* ボタン行 */
  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 420px;
  }

  .btn-sm {
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    font-family: var(--body-font);
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary { background: var(--accent); color: #000; }
  .btn-danger  { background: transparent; color: var(--accent2); border: 1px solid var(--accent2); }
  .btn-ghost   { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }

  /* エラー */
  .error-msg {
    background: rgba(255,51,102,0.1);
    border: 1px solid var(--accent2);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.85rem;
    color: var(--accent2);
    text-align: center;
    width: 100%;
    max-width: 420px;
    display: none;
  }
  .error-msg.visible { display: block; }

  /* 接続状態 */
  .connection-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    display: inline-block;
    margin-right: 6px;
  }
  .connection-dot.connected { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .connection-dot.error     { background: var(--accent2); }

  /* ゴール完了通知 */
  .finish-toast {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--accent);
    color: #000;
    font-family: var(--timer-font);
    font-size: 1.2rem;
    letter-spacing: 3px;
    padding: 12px 28px;
    border-radius: 30px;
    opacity: 0;
    transition: all 0.4s ease;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }

  .finish-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  canvas { display: none; }
</style>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
  <div class="header-title">🚀 START</div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="font-size:0.75rem;color:var(--text-dim);">
      <span class="connection-dot" id="conn-dot"></span>
      <span id="conn-label">接続中...</span>
    </span>
    <span class="status-badge waiting" id="status-badge">WAITING</span>
  </div>
</div>

<!-- ゴール完了トースト -->
<div class="finish-toast" id="finish-toast"></div>

<div class="main">

  <!-- 種目選択 -->
  <div class="event-select-wrap">
    <div class="event-select-label">種目</div>
    <div class="event-btns">
      <button class="event-btn selected" data-event="50m走">50m走</button>
      <button class="event-btn" data-event="100m走">100m走</button>
      <button class="event-btn" data-event="立ち幅跳び">立ち幅跳び</button>
      <button class="event-btn" data-event="その他">その他</button>
    </div>
  </div>

  <!-- NFC待機エリア -->
  <div class="nfc-area" id="nfc-area">
    <span class="nfc-icon">📡</span>
    <div class="nfc-label">NFC</div>
    <div class="nfc-instruction" id="nfc-instruction">カードをここにかざしてください</div>
  </div>

  <!-- 選手確認カード -->
  <div class="athlete-card" id="athlete-card">
    <div class="athlete-card-header">✅ 選手確認</div>
    <div class="athlete-card-name" id="athlete-name">—</div>
    <div class="athlete-card-meta" id="athlete-meta">—</div>
    <div class="confirm-btns">
      <button class="btn btn-ok" id="btn-ok">▶ スタート準備OK</button>
      <button class="btn btn-ng" id="btn-ng">✕ 違う</button>
    </div>
  </div>

  <!-- スタンバイ表示 -->
  <div class="standby-wrap" id="standby-wrap">
    <div class="standby-name" id="standby-name">—</div>
    <div class="standby-msg" id="standby-msg">ゴール側が準備中...</div>
    <button class="btn btn-cancel" id="btn-cancel-standby">キャンセル</button>
  </div>

  <!-- エラー -->
  <div class="error-msg" id="error-msg"></div>

  <!-- カメラ -->
  <div class="camera-section">
    <div class="camera-container">
      <video id="camera-feed" autoplay playsinline muted></video>
      <canvas id="detect-canvas"></canvas>
      <div class="detect-line" id="detect-line"></div>
      <div class="camera-overlay" id="camera-overlay">
        <span style="font-size:1.5rem;">📷</span>
        カメラを起動してください
      </div>
    </div>
  </div>

  <!-- 感度 -->
  <div class="sensitivity-wrap">
    <span>感度</span>
    <input type="range" id="sensitivity" min="10" max="80" value="30">
    <span id="sens-val">30</span>
  </div>

  <!-- ボタン -->
  <div class="btn-row">
    <button class="btn-sm btn-primary" id="btn-camera">📷 カメラ起動</button>
    <button class="btn-sm btn-danger" id="btn-cancel" style="display:none;">❌ キャンセル</button>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ========== Firebase設定 ==========
const firebaseConfig = {
  apiKey: "AIzaSyD8o8tRvsuqxr012DyR10j_DOY0dQ0uL7w",
  authDomain: "monjuni-timing.firebaseapp.com",
  databaseURL: "https://monjuni-timing-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "monjuni-timing",
  storageBucket: "monjuni-timing.firebasestorage.app",
  messagingSenderId: "705263409750",
  appId: "1:705263409750:web:cc8e7ee0700887680cb9f7"
};

// ========== GAS設定 ==========
const GAS_URL = "https://script.google.com/macros/s/AKfycbyAYCCjc_uun-LUW58wEInEXVOS4RvVKRDflVMHYbd4kb1GhP3hXfjC472OOsRHkBep/exec";

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const timingRef = ref(db, 'timing/current');

// ========== DOM ==========
const statusBadge     = document.getElementById('status-badge');
const nfcArea         = document.getElementById('nfc-area');
const nfcInstruction  = document.getElementById('nfc-instruction');
const athleteCard     = document.getElementById('athlete-card');
const athleteName     = document.getElementById('athlete-name');
const athleteMeta     = document.getElementById('athlete-meta');
const standbyWrap     = document.getElementById('standby-wrap');
const standbyName     = document.getElementById('standby-name');
const standbyMsg      = document.getElementById('standby-msg');
const errorMsg        = document.getElementById('error-msg');
const connDot         = document.getElementById('conn-dot');
const connLabel       = document.getElementById('conn-label');
const finishToast     = document.getElementById('finish-toast');
const cameraOverlay   = document.getElementById('camera-overlay');
const detectLine      = document.getElementById('detect-line');
const sensitivity     = document.getElementById('sensitivity');
const sensVal         = document.getElementById('sens-val');
const btnOk           = document.getElementById('btn-ok');
const btnNg           = document.getElementById('btn-ng');
const btnCancel       = document.getElementById('btn-cancel');
const btnCancelStandby = document.getElementById('btn-cancel-standby');
const btnCamera       = document.getElementById('btn-camera');
const video           = document.getElementById('camera-feed');
const canvas          = document.getElementById('detect-canvas');
const ctx             = canvas.getContext('2d');

// ========== 状態 ==========
let state = 'waiting';
let currentAthlete = null;
let selectedEvent  = '50m走';
let cameraReady    = false;
let detectInterval = null;
let prevPixels     = null;

// ========== 種目選択 ==========
document.querySelectorAll('.event-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.event-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedEvent = btn.dataset.event;
  });
});

// ========== Firebase監視（ゴール完了通知） ==========
onValue(timingRef, (snapshot) => {
  connDot.classList.add('connected');
  connDot.classList.remove('error');
  connLabel.textContent = 'Firebase接続済';

  const data = snapshot.val();
  if (!data) return;

  if (data.status === 'finished' && state === 'running') {
    // ゴール完了通知
    const elapsed = data.elapsedSec;
    showFinishToast(`${data.athleteName}  ${formatTime(elapsed)}`);
    stopDetection();
    resetToWaiting();
  }
}, (error) => {
  connDot.classList.remove('connected');
  connDot.classList.add('error');
  connLabel.textContent = '接続エラー';
});

// ========== NFC読み取り ==========
async function startNFCScan() {
  if (!('NDEFReader' in window)) {
    // iOSはWeb NFC非対応のためGASから検索する方式にフォールバック
    showManualInput();
    return;
  }

  try {
    const ndef = new NDEFReader();
    await ndef.scan();
    nfcArea.classList.add('active');
    nfcInstruction.textContent = 'スキャン中...';

    ndef.addEventListener('reading', ({ serialNumber }) => {
      // NFCカードのシリアル番号でGASから選手情報を取得
      lookupAthleteByNFC(serialNumber.toUpperCase().replace(/:/g, ''));
    });
  } catch(e) {
    showError('NFC読み取りエラー: ' + e.message);
  }
}

// ========== GASから選手情報取得 ==========
function lookupAthleteByNFC(nfcUID) {
  nfcInstruction.textContent = '選手情報取得中...';

  const script = document.createElement('script');
  script.src = `${GAS_URL}?action=getMemberByNFC&nfcUID=${nfcUID}&callback=onAthleteFound`;
  document.head.appendChild(script);

  // タイムアウト
  setTimeout(() => {
    if (state === 'waiting') {
      showError('選手情報の取得に失敗しました。もう一度かざしてください。');
      resetNFCArea();
    }
  }, 8000);
}

// ========== GASコールバック ==========
window.onAthleteFound = function(data) {
  if (!data || !data.success) {
    showError('登録されていないカードです。');
    resetNFCArea();
    return;
  }

  currentAthlete = data.member;
  showAthleteConfirm(currentAthlete);
};

// ========== iOSフォールバック：手動入力 ==========
function showManualInput() {
  nfcInstruction.textContent = 'Web NFCはiOSで非対応です。手動で選手を選択してください。';
  // GASから全選手リストを取得してドロップダウン表示
  loadAthleteList();
}

function loadAthleteList() {
  const script = document.createElement('script');
  script.src = `${GAS_URL}?action=getMembers&callback=onMembersLoaded`;
  document.head.appendChild(script);
}

window.onMembersLoaded = function(data) {
  if (!data || !data.members) return;

  const select = document.createElement('select');
  select.style.cssText = `
    width:100%; padding:10px; margin-top:10px;
    background:var(--surface); color:var(--text);
    border:1px solid var(--border); border-radius:8px;
    font-family:var(--body-font); font-size:1rem;
  `;
  select.innerHTML = '<option value="">-- 選手を選択 --</option>' +
    data.members.map(m =>
      `<option value="${m.id}">${m.name}</option>`
    ).join('');

  select.addEventListener('change', () => {
    const member = data.members.find(m => m.id === select.value);
    if (member) {
      currentAthlete = member;
      showAthleteConfirm(member);
    }
  });

  nfcArea.appendChild(select);
};

// ========== 選手確認表示 ==========
function showAthleteConfirm(athlete) {
  athleteName.textContent = athlete.name || '—';
  athleteMeta.textContent = `${athlete.grade || ''}  ${selectedEvent}`;
  athleteCard.classList.add('visible');
  nfcArea.classList.add('confirmed');
  setStatus('confirm');
  showError(false);
}

// ========== OK：スタート準備 ==========
btnOk.addEventListener('click', () => {
  if (!currentAthlete) return;

  athleteCard.classList.remove('visible');
  standbyName.textContent = currentAthlete.name;
  standbyMsg.textContent  = 'ゴール側に信号送信中...';
  standbyWrap.classList.add('visible');
  nfcArea.style.display = 'none';
  btnCancel.style.display = 'inline-block';
  setStatus('ready');

  // Firebaseにready状態を送信
  set(timingRef, {
    status:      'ready',
    athleteId:   currentAthlete.id || currentAthlete.memberId || '',
    athleteName: currentAthlete.name,
    event:       selectedEvent,
    readyTime:   Date.now()
  }).then(() => {
    standbyMsg.textContent = 'ゴール側が準備完了したらスタートを合図してください';
    startCameraMonitoring();
  });
});

// ========== NG：やり直し ==========
btnNg.addEventListener('click', () => {
  athleteCard.classList.remove('visible');
  nfcArea.classList.remove('confirmed', 'active');
  currentAthlete = null;
  nfcInstruction.textContent = 'カードをここにかざしてください';
  setStatus('waiting');
  showError(false);
});

// ========== キャンセル ==========
btnCancel.addEventListener('click', cancelRun);
btnCancelStandby.addEventListener('click', cancelRun);

function cancelRun() {
  set(timingRef, { status: 'cancel' });
  stopDetection();
  resetToWaiting();
}

// ========== カメラ起動 ==========
btnCamera.addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      cameraReady   = true;
      cameraOverlay.classList.add('hidden');
      detectLine.style.display = 'block';
    };
    btnCamera.style.display = 'none';
  } catch(e) {
    showError('カメラにアクセスできません: ' + e.message);
  }
});

// ========== スタートライン検知 ==========
function startCameraMonitoring() {
  if (!cameraReady) return;
  prevPixels = null;

  detectInterval = setInterval(() => {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const cx     = Math.floor(canvas.width / 2);
    const pixels = ctx.getImageData(cx, 0, 1, canvas.height).data;

    if (prevPixels && state === 'ready') {
      let diff = 0;
      for (let i = 0; i < pixels.length; i += 4) {
        diff += Math.abs(pixels[i] - prevPixels[i]);
      }
      const avgDiff = diff / (canvas.height * 255);
      const thresh  = parseInt(sensitivity.value) / 1000;

      if (avgDiff > thresh) {
        startDetected();
      }
    }

    prevPixels = new Uint8ClampedArray(pixels);
  }, 33);
}

// ========== スタート検知 ==========
function startDetected() {
  if (state !== 'ready') return;
  const startTime = Date.now();
  setStatus('running');
  standbyMsg.textContent = '計測中...';

  // Firebaseにstartedを送信
  set(timingRef, {
    status:      'started',
    athleteId:   currentAthlete?.id || '',
    athleteName: currentAthlete?.name || '',
    event:       selectedEvent,
    startTime:   startTime
  });
}

function stopDetection() {
  clearInterval(detectInterval);
  prevPixels = null;
}

// ========== ゴール完了トースト ==========
function showFinishToast(msg) {
  finishToast.textContent = `🏁 ${msg}`;
  finishToast.classList.add('show');
  setTimeout(() => finishToast.classList.remove('show'), 4000);
}

// ========== リセット ==========
function resetToWaiting() {
  setStatus('waiting');
  athleteCard.classList.remove('visible');
  standbyWrap.classList.remove('visible');
  nfcArea.style.display = 'block';
  nfcArea.classList.remove('active', 'confirmed');
  nfcInstruction.textContent = 'カードをここにかざしてください';
  btnCancel.style.display = 'none';
  currentAthlete = null;
  showError(false);
}

function resetNFCArea() {
  nfcArea.classList.remove('active', 'confirmed');
  nfcInstruction.textContent = 'カードをここにかざしてください';
  setStatus('waiting');
}

// ========== UI補助 ==========
function setStatus(s) {
  state = s;
  const labels = {
    waiting:  'WAITING',
    confirm:  'CONFIRM?',
    ready:    'READY',
    running:  'RUNNING',
    finished: 'FINISH!',
    error:    'ERROR'
  };
  statusBadge.textContent = labels[s] || s.toUpperCase();
  statusBadge.className   = `status-badge ${s}`;
}

function showError(show, msg = '') {
  errorMsg.textContent = msg;
  errorMsg.classList.toggle('visible', show);
}

function formatTime(sec) {
  const s  = Math.floor(sec);
  const ms = Math.floor((sec - s) * 100);
  return `${String(s).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
}

// ========== 感度スライダー ==========
sensitivity.addEventListener('input', () => {
  sensVal.textContent = sensitivity.value;
});

// ========== 初期化：NFCスキャン開始 ==========
startNFCScan();
setStatus('waiting');
</script>
