<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GOAL – モンジュニ計測</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700&display=swap');
  :root {
    --bg:#0a0a0f;--surface:#13131a;--border:#1e1e2e;
    --accent:#00ff88;--accent2:#ff3366;--warn:#ffaa00;
    --text:#e8e8f0;--text-dim:#666680;
    --timer-font:'Bebas Neue',sans-serif;--body-font:'Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--body-font);min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(0,255,136,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,0.03) 1px,transparent 1px);
    background-size:40px 40px;}
  .header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
    border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10;}
  .header-title{font-family:var(--timer-font);font-size:1.3rem;letter-spacing:4px;color:var(--accent);}
  .conn-wrap{display:flex;align-items:center;gap:6px;font-size:0.7rem;color:var(--text-dim);}
  .conn-dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);}
  .conn-dot.ok{background:var(--accent);box-shadow:0 0 5px var(--accent);}
  .conn-dot.err{background:var(--accent2);}
  .main{display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px;}

  /* ランナー一覧 */
  .runners-panel{width:100%;max-width:480px;}
  .section-label{font-size:0.6rem;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;}
  .runner-list{display:flex;flex-direction:column;gap:6px;}
  .runner-item{display:flex;align-items:center;gap:12px;padding:10px 14px;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;transition:all 0.3s;}
  .runner-item.started{border-color:var(--warn);background:rgba(255,170,0,0.05);}
  .runner-item.next{border-color:var(--accent);background:rgba(0,255,136,0.05);
    box-shadow:0 0 15px rgba(0,255,136,0.1);}
  .runner-num{font-family:var(--timer-font);font-size:1.4rem;color:var(--text-dim);width:24px;text-align:center;}
  .runner-info{flex:1;}
  .runner-name{font-weight:700;font-size:1rem;margin-bottom:2px;}
  .runner-event{font-size:0.7rem;color:var(--text-dim);}
  .runner-timer{font-family:var(--timer-font);font-size:1.6rem;color:var(--warn);letter-spacing:2px;}
  .runner-item.next .runner-timer{color:var(--accent);}

  /* 次のゴール表示 */
  .next-goal{width:100%;max-width:480px;text-align:center;
    background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:14px;
    display:none;}
  .next-goal.visible{display:block;}
  .next-goal-label{font-size:0.6rem;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:4px;}
  .next-goal-name{font-size:1.4rem;font-weight:700;margin-bottom:8px;}
  .next-goal-timer{font-family:var(--timer-font);font-size:4rem;color:var(--accent);
    letter-spacing:4px;line-height:1;text-shadow:0 0 30px rgba(0,255,136,0.3);}

  /* ゴール結果 */
  .result-flash{position:fixed;inset:0;background:rgba(0,255,136,0.15);
    pointer-events:none;opacity:0;transition:opacity 0.3s;z-index:50;}
  .result-flash.show{opacity:1;}

  /* カメラ */
  .camera-section{width:100%;max-width:480px;}
  .camera-container{width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;
    overflow:hidden;position:relative;border:1px solid var(--border);}
  #camera-feed{width:100%;height:100%;object-fit:cover;}
  .detect-line{position:absolute;top:0;bottom:0;left:50%;width:2px;
    background:rgba(0,255,136,0.6);transform:translateX(-50%);pointer-events:none;display:none;}
  .camera-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(10,10,15,0.85);border-radius:8px;font-size:0.85rem;
    color:var(--text-dim);flex-direction:column;gap:6px;}
  .camera-overlay.hidden{display:none;}

  /* 感度 */
  .sensitivity-wrap{display:flex;align-items:center;gap:8px;font-size:0.7rem;
    color:var(--text-dim);width:100%;max-width:480px;}
  .sensitivity-wrap input[type=range]{flex:1;accent-color:var(--accent);}

  /* ボタン */
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:480px;}
  .btn-sm{padding:9px 18px;border-radius:6px;border:none;font-family:var(--body-font);
    font-size:0.8rem;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#000;}
  .btn-danger{background:transparent;color:var(--accent2);border:1px solid var(--accent2);}

  /* 記録リスト */
  .records-panel{width:100%;max-width:480px;}
  .records-list{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto;}
  .record-item{display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:8px 12px;animation:slide-in 0.3s ease;}
  @keyframes slide-in{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
  .r-name{font-weight:700;font-size:0.9rem;}
  .r-time{font-family:var(--timer-font);font-size:1.2rem;color:var(--accent);}
  .r-meta{font-size:0.7rem;color:var(--text-dim);}
  .btn-invalidate{background:transparent;border:1px solid var(--border);color:var(--text-dim);
    padding:3px 7px;border-radius:4px;font-size:0.65rem;cursor:pointer;font-family:var(--body-font);}
  .btn-invalidate:hover{border-color:var(--accent2);color:var(--accent2);}
  .record-item.invalid{opacity:0.4;border-color:var(--accent2);}
  .record-item.invalid .r-time{color:var(--accent2);text-decoration:line-through;}


  /* 横向き対応 */
  @media (orientation: landscape) {
    .main { flex-direction: row; flex-wrap: wrap; align-items: flex-start; padding: 8px; gap: 8px; }
    .next-goal { max-width: 48%; }
    .runners-panel { max-width: 48%; }
    .camera-section { max-width: 48%; }
    .sensitivity-wrap { max-width: 48%; }
    .btn-row { max-width: 48%; }
    .records-panel { max-width: 100%; }
    .next-goal-timer { font-size: 3rem; }
  }
  canvas{display:none;}

  /* 手動ゴールボタン（大きく） */
  .btn-manual-goal-big{
    width:100%;max-width:480px;
    padding:24px 20px;
    border-radius:14px;border:none;
    font-family:var(--timer-font);font-size:2.4rem;letter-spacing:4px;
    background:var(--accent2);color:#fff;
    cursor:pointer;transition:all 0.15s;
    box-shadow:0 0 20px rgba(255,51,102,0.3);
    line-height:1.2;
    margin-bottom:8px;
  }
  .btn-manual-goal-big:active{transform:scale(0.96);filter:brightness(1.2);}
  .btn-manual-goal-big:disabled{opacity:0.3;cursor:not-allowed;}
</style>
</head>
<body>

<div class="result-flash" id="result-flash"></div>

<div class="header">
  <div class="header-title">⚡ GOAL</div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="conn-wrap">
      <span class="conn-dot" id="conn-dot"></span>
      <span id="conn-label">接続中...</span>
    </div>
    <span style="font-size:0.75rem;color:var(--text-dim);" id="running-count">走者: 0人</span>
  </div>
</div>

<div class="main">

  <!-- 次のゴール表示 -->
  <div class="next-goal" id="next-goal">
    <div class="next-goal-label">⬇ NEXT GOAL</div>
    <div class="next-goal-name" id="next-goal-name">—</div>
    <div class="next-goal-timer" id="next-goal-timer">00.00</div>
  </div>

  <!-- ランナー一覧 -->
  <div class="runners-panel">
    <div class="section-label">計測中</div>
    <div class="runner-list" id="runner-list">
      <div style="color:var(--text-dim);font-size:0.8rem;padding:6px;">走者なし</div>
    </div>
  </div>

  <!-- カメラ -->
  <div class="camera-section">
    <div class="camera-container">
      <video id="camera-feed" autoplay playsinline muted></video>
      <canvas id="detect-canvas"></canvas>
      <div class="detect-line" id="detect-line"></div>
      <div class="camera-overlay" id="camera-overlay">
        <span style="font-size:1.3rem;">📷</span>
        カメラを起動してください
      </div>
    </div>
  </div>

  <!-- 感度 -->
  <div class="sensitivity-wrap">
    <span>感度</span>
    <input type="range" id="sensitivity" min="10" max="80" value="30">
    <span id="sens-val">30</span>
  </div>

  <!-- 手動ゴールボタン（大きく・押しやすく） -->
  <button class="btn-manual-goal-big" id="btn-manual-goal">
    ⏱ STOP<br><span style="font-size:0.8rem;letter-spacing:2px;">手動ゴール</span>
  </button>

  <!-- カメラボタン行 -->
  <div class="btn-row">
    <button class="btn-sm btn-primary" id="btn-camera">📷 カメラ起動</button>
    <button class="btn-sm btn-ghost" id="btn-camera-stop" style="display:none;">⏹ カメラ停止</button>
  </div>

  <!-- 本日の記録 -->
  <div class="records-panel">
    <div class="section-label">本日の記録</div>
    <div class="records-list" id="records-list">
      <div style="color:var(--text-dim);font-size:0.8rem;padding:6px;">まだ記録がありません</div>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyD8o8tRvsuqxr012DyR10j_DOY0dQ0uL7w",
  authDomain:"monjuni-timing.firebaseapp.com",
  databaseURL:"https://monjuni-timing-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"monjuni-timing",
  storageBucket:"monjuni-timing.firebasestorage.app",
  messagingSenderId:"705263409750",
  appId:"1:705263409750:web:cc8e7ee0700887680cb9f7"
};

const TIMING_GAS = "https://script.google.com/macros/s/AKfycbyAYCCjc_uun-LUW58wEInEXVOS4RvVKRDflVMHYbd4kb1GhP3hXfjC472OOsRHkBep/exec";

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const queueRef     = ref(db, 'timing/queue');
const finishedRef  = ref(db, 'timing/lastFinished');

// DOM
const connDot       = document.getElementById('conn-dot');
const connLabel     = document.getElementById('conn-label');
const runningCount  = document.getElementById('running-count');
const nextGoalPanel = document.getElementById('next-goal');
const nextGoalName  = document.getElementById('next-goal-name');
const nextGoalTimer = document.getElementById('next-goal-timer');
const runnerList    = document.getElementById('runner-list');
const recordsList   = document.getElementById('records-list');
const cameraOverlay = document.getElementById('camera-overlay');
const detectLine    = document.getElementById('detect-line');
const sensitivity   = document.getElementById('sensitivity');
const sensVal       = document.getElementById('sens-val');
const btnCamera     = document.getElementById('btn-camera');
const btnManualGoal = document.getElementById('btn-manual-goal');
const video         = document.getElementById('camera-feed');
const canvas        = document.getElementById('detect-canvas');
const ctx           = canvas.getContext('2d');
const resultFlash   = document.getElementById('result-flash');

let queue         = [];
let todayRecords  = [];
let cameraReady   = false;
let detectInterval= null;
let prevPixels    = null;
let timerInterval = null;
let goalCooldown  = false; // 連続誤検知防止

// Firebase キュー監視
onValue(queueRef, (snapshot) => {
  connDot.classList.add('ok');
  connDot.classList.remove('err');
  connLabel.textContent = '接続済';

  const data = snapshot.val();
  if (!data) {
    queue = [];
  } else if (Array.isArray(data)) {
    queue = data.filter(item => item && item.id);
  } else {
    // Start App のオブジェクト形式 {item_0: {...}, item_1: {...}}
    queue = Object.values(data).filter(item => item && item.id);
  }
  // startTime を必ず数値に変換
  queue.forEach(item => {
    item.startTime = item.startTime ? Number(item.startTime) : 0;
  });
  console.log('[Goal] queue updated:', queue.map(q => ({
    name: q.athleteName,
    status: q.status,
    startTime: q.startTime,
    sinceStart: q.startTime ? ((Date.now() - q.startTime)/1000).toFixed(1)+'s' : 'none'
  })));
  renderRunners();
  updateNextGoal();
}, () => {
  connDot.classList.remove('ok');
  connDot.classList.add('err');
  connLabel.textContent = '接続エラー';
});

// ゴール済みリスト（ローカル保持）
let finishedList = [];

// ランナー描画
function renderRunners() {
  const started = queue.filter(q => q.status === 'started');
  document.getElementById('running-count').textContent = `計測中: ${started.length}人`;

  // 待機走者数を Firebase から受け取る（別で処理）
  let html = '';

  if (!started.length && !finishedList.length) {
    runnerList.innerHTML = '<div style="color:var(--text-dim);font-size:0.8rem;padding:6px;">走者なし</div>';
    return;
  }

  // 計測中（上に表示）
  html += started.map((q, i) => {
    const uniqueId = `rt-${q.athleteId}-${q.startTime || i}`;
    const elapsed = q.startTime ? formatTime((serverNow() - Number(q.startTime)) / 1000) : '00.00';
    return `
      <div class="runner-item started ${i === 0 ? 'next' : ''}">
        <span class="runner-num">${i+1}</span>
        <div class="runner-info">
          <div class="runner-name">${i === 0 ? '▶ ' : ''}${q.athleteName}</div>
          <div class="runner-event">${q.event || ''}</div>
        </div>
        <span class="runner-timer" id="${uniqueId}">${elapsed}</span>
      </div>`;
  }).join('');

  // 区切り線
  if (started.length && finishedList.length) {
    html += '<div style="border-top:1px solid var(--border);margin:8px 0;"></div>';
  }

  // ゴール済み（下に表示・削除ボタン付き）
  html += finishedList.map((f, i) => `
    <div class="runner-item finished" style="opacity:0.7;">
      <span class="runner-num" style="color:var(--accent);">✓</span>
      <div class="runner-info">
        <div class="runner-name">${f.athleteName}</div>
        <div class="runner-event">${f.event || ''}</div>
      </div>
      <span class="runner-timer" style="color:var(--accent);">${formatTime(f.elapsedSec)}</span>
      <button onclick="removeFinished(${i})" style="
        background:none;border:none;color:var(--accent2);
        font-size:1rem;cursor:pointer;padding:4px 8px;margin-left:4px;">✕</button>
    </div>`).join('');

  runnerList.innerHTML = html;
}

// ゴール済みを削除
function removeFinished(idx) {
  finishedList.splice(idx, 1);
  renderRunners();
}

// 次のゴール表示更新
function updateNextGoal() {
  const next = queue.find(q => q.status === 'started');
  if (next) {
    nextGoalPanel.classList.add('visible');
    nextGoalName.textContent = next.athleteName;
  } else {
    nextGoalPanel.classList.remove('visible');
  }
}

// タイマー更新（100msごとにDOM直接更新）
timerInterval = setInterval(() => {
  const started = queue.filter(q => q.status === 'started');
  if (!started.length) return;

  // 次のゴール大タイマー
  const next = started[0];
  if (next?.startTime) {
    const elapsed = (serverNow() - Number(next.startTime)) / 1000;
    nextGoalTimer.textContent = formatTime(elapsed);
  }

  // 各ランナーのタイマー（一意IDで更新）
  started.forEach((q, i) => {
    if (!q.startTime) return;
    const uniqueId = `rt-${q.athleteId}-${q.startTime || i}`;
    const el = document.getElementById(uniqueId);
    if (el) {
      el.textContent = formatTime((serverNow() - Number(q.startTime)) / 1000);
    }
  });
}, 100);

// カメラ起動
const btnCameraStop = document.getElementById('btn-camera-stop');

btnCamera.addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'environment', width:{ideal:1280}, height:{ideal:720} }
    });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      cameraReady = true;
      cameraOverlay.classList.add('hidden');
      detectLine.style.display = 'block';
      startDetection();
    };
    btnCamera.style.display = 'none';
    btnCameraStop.style.display = '';
  } catch(e) { alert('カメラエラー: ' + e.message); }
});

// カメラ停止
btnCameraStop.addEventListener('click', () => {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  clearInterval(detectInterval);
  detectInterval = null;
  cameraReady = false;
  cameraOverlay.classList.remove('hidden');
  detectLine.style.display = 'none';
  btnCamera.style.display = '';
  btnCameraStop.style.display = 'none';
});

// ライン検知
function startDetection() {
  prevPixels = null;
  detectInterval = setInterval(() => {
    if (!queue.some(q => q.status === 'started')) return;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const cx = Math.floor(canvas.width / 2);
    const pixels = ctx.getImageData(cx, 0, 1, canvas.height).data;
    // goalCooldown 中・計測中走者なしの場合はスキップ
    const hasRunner = queue.some(q => q.status === 'started');
    if (prevPixels && !goalCooldown && hasRunner) {
      let diff = 0;
      for (let i = 0; i < pixels.length; i += 4) diff += Math.abs(pixels[i] - prevPixels[i]);
      const avgDiff = diff / (canvas.height * 255);
      if (avgDiff > parseInt(sensitivity.value) / 1000) {
        goalDetected();
      }
    }
    prevPixels = new Uint8ClampedArray(pixels);
  }, 33);
}

// ゴール検知
function goalDetected() {
  // 追い越しなし前提：最初にstartedになった選手がゴール
  const nextIdx = queue.findIndex(q => q.status === 'started');
  if (nextIdx === -1) return;

  const runner = queue[nextIdx];

  // スタートから最低3秒間はゴール検知しない（誤検知防止）
  if (runner.startTime) {
    const sinceStart = (Date.now() - Number(runner.startTime)) / 1000;
    if (sinceStart < 3.0) return;
  }

  const goalTime = Date.now();
  const elapsed  = (goalTime - Number(runner.startTime)) / 1000;

  // クールダウン（2秒間は次の検知をしない）
  goalCooldown = true;
  setTimeout(() => { goalCooldown = false; }, 2000);

  // フラッシュ
  resultFlash.classList.add('show');
  setTimeout(() => resultFlash.classList.remove('show'), 300);

  // 記録
  recordGoal(runner, elapsed, goalTime);
}

// 手動ゴール（連続タップ対応・クールダウンなし）
let manualCooldown = false;
btnManualGoal.addEventListener('click', () => {
  if (manualCooldown) return;
  const nextIdx = queue.findIndex(q => q.status === 'started');
  if (nextIdx === -1) { return; }
  manualCooldown = true;
  setTimeout(() => { manualCooldown = false; }, 500); // 0.5秒クールダウン
  const runner   = queue[nextIdx];
  const goalTime = Date.now();
  const elapsed  = (goalTime - Number(runner.startTime)) / 1000;
  recordGoal(runner, elapsed, goalTime);
});

function recordGoal(runner, elapsed, goalTime) {
  // GASに記録
  const params = new URLSearchParams({
    action:      'recordPerformance',
    athleteId:   runner.athleteId || '',
    athleteName: runner.athleteName,
    event:       runner.event || '',
    elapsedSec:  elapsed.toFixed(2),
    goalTime:    goalTime
  });
  fetch(`${TIMING_GAS}?${params}&callback=cb`, { mode:'no-cors' }).catch(() => {});

  // Firebaseのキューを更新（Start Appと同じオブジェクト形式）
  const updatedQueue = [...queue];
  updatedQueue[queue.findIndex(q => q.athleteId === runner.athleteId && q.status === 'started')] = {
    ...runner, status:'finished', elapsedSec: elapsed
  };
  const queueMap = {};
  updatedQueue.forEach((item, idx) => { queueMap[`item_${idx}`] = item; });
  set(ref(db, 'timing/queue'), queueMap);

  // lastFinishedに通知（スタート側・コントローラーに伝える）
  set(ref(db, 'timing/lastFinished'), {
    athleteId:   runner.athleteId,
    athleteName: runner.athleteName,
    event:       runner.event,
    elapsedSec:  elapsed,
    goalTime:    goalTime,
    ts:          Date.now()
  });

  // 今日の記録に追加
  addTodayRecord(runner, elapsed);
}

function addTodayRecord(runner, elapsed) {
  const record = {
    uid:         Date.now(),
    athleteId:   runner.athleteId,
    athleteName: runner.athleteName,
    event:       runner.event,
    elapsedSec:  elapsed,
    time:        new Date().toLocaleTimeString('ja-JP'),
    invalid:     false
  };
  todayRecords.unshift(record);
  renderRecords();
}

function renderRecords() {
  if (!todayRecords.length) {
    recordsList.innerHTML = '<div style="color:var(--text-dim);font-size:0.8rem;padding:6px;">まだ記録がありません</div>';
    return;
  }
  recordsList.innerHTML = todayRecords.map(r => `
    <div class="record-item ${r.invalid ? 'invalid' : ''}">
      <div>
        <div class="r-name">${r.athleteName}</div>
        <div class="r-meta">${r.event || ''} · ${r.time}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="r-time">${formatTime(r.elapsedSec)}</span>
        <button class="btn-invalidate" onclick="toggleInvalid(${r.uid})">${r.invalid ? '✅復活' : '❌無効'}</button>
      </div>
    </div>
  `).join('');
}

window.toggleInvalid = function(uid) {
  const r = todayRecords.find(r => r.uid === uid);
  if (!r) return;
  r.invalid = !r.invalid;
  renderRecords();
};

function formatTime(sec) {
  if (!sec) return '00.00';
  const s  = Math.floor(sec);
  const ms = Math.floor((sec - s) * 100);
  return `${String(s).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
}

sensitivity.addEventListener('input', () => { sensVal.textContent = sensitivity.value; });
</script>
</body>
</html>
