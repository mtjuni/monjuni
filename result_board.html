<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RESULT – モンジュニ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&display=swap');
  :root {
    --bg:#0a0a0f;--surface:#13131a;--border:#1e1e2e;
    --accent:#00ff88;--accent2:#ff3366;--warn:#ffaa00;--gold:#ffd700;--silver:#c8d0e0;--bronze:#e0a060;
    --text:#e8e8f0;--text-dim:#666680;
    --timer-font:'Bebas Neue',sans-serif;--body-font:'Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);font-family:var(--body-font);
    overflow:hidden;min-height:100vh;display:flex;flex-direction:column;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(0,255,136,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,0.03) 1px,transparent 1px);
    background-size:40px 40px;}

  /* ヘッダー */
  .header{display:flex;align-items:center;justify-content:space-between;
    padding:10px 18px;border-bottom:1px solid var(--border);background:var(--surface);
    flex-shrink:0;}
  .header-left{display:flex;align-items:center;gap:14px;}
  .header-title{font-family:var(--timer-font);font-size:1.5rem;letter-spacing:5px;color:var(--accent);}
  .header-event{font-size:1.05rem;font-weight:700;color:var(--text);
    padding:4px 14px;border:1px solid var(--border);border-radius:20px;background:var(--bg);}
  .header-right{display:flex;align-items:center;gap:12px;}
  .conn-wrap{display:flex;align-items:center;gap:6px;font-size:0.75rem;color:var(--text-dim);}
  .conn-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);}
  .conn-dot.ok{background:var(--accent);box-shadow:0 0 6px var(--accent);}
  .conn-dot.err{background:var(--accent2);}
  .order-badge{font-size:0.7rem;color:var(--text-dim);letter-spacing:2px;
    border:1px solid var(--border);border-radius:14px;padding:3px 10px;}
  .gear-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);
    border-radius:8px;width:38px;height:38px;font-size:1.1rem;cursor:pointer;}
  .gear-btn:active{border-color:var(--accent);color:var(--accent);}

  /* メインランキング */
  .board{flex:1;display:flex;flex-direction:column;padding:14px 18px;gap:10px;
    overflow:hidden;min-height:0;}
  .row{flex:1 1 0;min-height:0;display:flex;align-items:center;gap:16px;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:0 24px;transition:background 0.3s,border-color 0.3s;}
  .row.flash{animation:flash 0.8s ease;}
  @keyframes flash{0%{background:rgba(0,255,136,0.35);}100%{background:var(--surface);}}
  .row.r1{border-color:var(--gold);background:linear-gradient(90deg,rgba(255,215,0,0.10),var(--surface));}
  .row.r2{border-color:var(--silver);background:linear-gradient(90deg,rgba(200,208,224,0.08),var(--surface));}
  .row.r3{border-color:var(--bronze);background:linear-gradient(90deg,rgba(224,160,96,0.08),var(--surface));}

  .r-rank{font-family:var(--timer-font);font-size:clamp(1.4rem,5vh,3.2rem);
    color:var(--text-dim);width:1.6em;text-align:center;flex-shrink:0;}
  .row.r1 .r-rank{color:var(--gold);}
  .row.r2 .r-rank{color:var(--silver);}
  .row.r3 .r-rank{color:var(--bronze);}

  .r-info{flex:1;min-width:0;display:flex;align-items:baseline;gap:14px;}
  .r-name{font-weight:900;font-size:clamp(1.2rem,4.4vh,2.6rem);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .r-grade{font-size:clamp(0.75rem,2vh,1.1rem);color:var(--text-dim);
    border:1px solid var(--border);border-radius:10px;padding:2px 10px;flex-shrink:0;white-space:nowrap;}

  .r-time{font-family:var(--timer-font);font-size:clamp(1.6rem,6vh,3.8rem);
    color:var(--accent);letter-spacing:2px;flex-shrink:0;}
  .row.r1 .r-time{color:var(--gold);}
  .row.r2 .r-time{color:var(--silver);}
  .row.r3 .r-time{color:var(--bronze);}

  .empty-msg{flex:1;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:1.2rem;text-align:center;line-height:1.8;}

  /* 設定パネル */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;z-index:90;}
  .overlay.show{display:block;}
  .settings{position:fixed;top:0;right:0;height:100%;width:min(360px,88vw);
    background:var(--surface);border-left:1px solid var(--border);
    transform:translateX(100%);transition:transform 0.25s ease;
    z-index:100;padding:20px;overflow-y:auto;}
  .settings.show{transform:translateX(0);}
  .settings h2{font-family:var(--timer-font);letter-spacing:3px;color:var(--accent);
    font-size:1.2rem;margin-bottom:16px;}
  .s-label{font-size:0.7rem;letter-spacing:2px;color:var(--text-dim);
    text-transform:uppercase;margin:18px 0 8px;}
  .s-select{width:100%;padding:12px;background:var(--bg);color:var(--text);
    border:1px solid var(--border);border-radius:8px;font-family:var(--body-font);
    font-size:1rem;}
  .s-row{display:flex;gap:8px;}
  .s-btn{flex:1;padding:12px;border-radius:8px;border:1px solid var(--border);
    background:var(--bg);color:var(--text-dim);font-family:var(--body-font);
    font-size:0.9rem;font-weight:700;cursor:pointer;}
  .s-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,255,136,0.08);}
  .s-input{width:100%;padding:12px;background:var(--bg);color:var(--text);
    border:1px solid var(--border);border-radius:8px;font-size:1rem;font-family:var(--body-font);}
  .s-close{margin-top:24px;width:100%;padding:14px;border:none;border-radius:8px;
    background:var(--accent);color:#000;font-weight:700;font-size:1rem;cursor:pointer;}
  .s-hint{font-size:0.7rem;color:var(--text-dim);margin-top:6px;line-height:1.6;}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-title">🏆 RESULT</div>
    <div class="header-event" id="event-label">—</div>
    <div class="order-badge" id="order-label">速い順</div>
  </div>
  <div class="header-right">
    <div class="conn-wrap">
      <span class="conn-dot" id="conn-dot"></span>
      <span id="conn-label">接続中...</span>
    </div>
    <button class="gear-btn" id="btn-gear">⚙</button>
  </div>
</div>

<div class="board" id="board">
  <div class="empty-msg">記録を読み込み中...</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="settings" id="settings">
  <h2>⚙ 表示設定</h2>

  <div class="s-label">種目</div>
  <select class="s-select" id="sel-event">
    <option value="">すべて（本日の全種目）</option>
  </select>
  <div class="s-hint">本日記録のある種目から自動的に選べます。一覧は数秒ごとに更新されます。</div>

  <div class="s-label">並び順</div>
  <div class="s-row">
    <button class="s-btn" id="btn-asc">⏱ 速い順（短い）</button>
    <button class="s-btn" id="btn-desc">⏳ 長い順（耐久）</button>
  </div>

  <div class="s-label">最大表示件数</div>
  <input class="s-input" id="inp-limit" type="number" min="3" max="30" value="20">
  <div class="s-hint">画面の向きや大きさに応じて、実際に表示できる行数は自動的に調整されます。</div>

  <button class="s-close" id="btn-close">閉じる</button>
</div>

<script>
const TIMING_GAS = "https://script.google.com/macros/s/AKfycbyAYCCjc_uun-LUW58wEInEXVOS4RvVKRDflVMHYbd4kb1GhP3hXfjC472OOsRHkBep/exec";

const board       = document.getElementById('board');
const eventLabel  = document.getElementById('event-label');
const orderLabel  = document.getElementById('order-label');
const connDot     = document.getElementById('conn-dot');
const connLabel   = document.getElementById('conn-label');
const overlay     = document.getElementById('overlay');
const settingsEl  = document.getElementById('settings');
const selEvent    = document.getElementById('sel-event');
const inpLimit    = document.getElementById('inp-limit');
const btnAsc      = document.getElementById('btn-asc');
const btnDesc     = document.getElementById('btn-desc');

// ===== 設定（localStorageに保存） =====
const DEFAULT_SETTINGS = { event: '', order: 'asc', limit: 20 };
let settings = { ...DEFAULT_SETTINGS, ...loadSettings() };

function loadSettings() {
  try {
    const raw = localStorage.getItem('monjuniResultBoardSettings');
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveSettings() {
  try { localStorage.setItem('monjuniResultBoardSettings', JSON.stringify(settings)); } catch(e) {}
}

function applySettingsToUI() {
  inpLimit.value = settings.limit;
  btnAsc.classList.toggle('active', settings.order === 'asc');
  btnDesc.classList.toggle('active', settings.order !== 'asc');
  orderLabel.textContent = settings.order === 'asc' ? '速い順' : '長い順';
  selEvent.value = settings.event;
  eventLabel.textContent = settings.event || 'すべて';
}
applySettingsToUI();

// ===== JSONP =====
function jsonp(params) {
  return new Promise((resolve, reject) => {
    const cbName = '__cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let done = false;
    const cleanup = () => { delete window[cbName]; script.remove(); };
    window[cbName] = (data) => { done = true; cleanup(); resolve(data); };
    const qs = new URLSearchParams({ ...params, callback: cbName });
    script.src = `${TIMING_GAS}?${qs.toString()}`;
    script.onerror = () => { if (!done) { cleanup(); reject(new Error('load error')); } };
    document.body.appendChild(script);
    setTimeout(() => { if (!done) { cleanup(); reject(new Error('timeout')); } }, 8000);
  });
}

// ===== 日付ユーティリティ =====
function jstDateStr(d) {
  const jst = new Date(d.getTime() + 9 * 60 * 60 * 1000);
  return jst.toISOString().slice(0, 10);
}
function todayJST() { return jstDateStr(new Date()); }

// ===== 時間フォーマット =====
function formatTime(sec) {
  if (sec == null || isNaN(sec)) return '--.--';
  if (sec >= 60) {
    const m = Math.floor(sec / 60);
    const s = sec - m * 60;
    return `${m}:${s.toFixed(2).padStart(5, '0')}`;
  }
  return sec.toFixed(2);
}

// ===== ランキング描画 =====
let lastAthletes = [];
function renderResults(results) {
  if (!results || !results.length) {
    board.innerHTML = '<div class="empty-msg">本日の記録はまだありません<br>計測をお待ちください</div>';
    lastAthletes = [];
    return;
  }

  const currentAthletes = results.map(r => r.athleteName);
  const isNewTop = results[0] && results[0].athleteName !== lastAthletes[0] && lastAthletes.length > 0;

  board.innerHTML = results.map((r, i) => {
    const rankClass = r.rank === 1 ? 'r1' : r.rank === 2 ? 'r2' : r.rank === 3 ? 'r3' : '';
    const flash = (isNewTop && i === 0) ? 'flash' : '';
    const grade = r.grade ? `<span class="r-grade">${escapeHtml(r.grade)}</span>` : '';
    return `
      <div class="row ${rankClass} ${flash}">
        <div class="r-rank">${r.rank}</div>
        <div class="r-info">
          <div class="r-name">${escapeHtml(r.athleteName)}</div>
          ${grade}
        </div>
        <div class="r-time">${formatTime(r.elapsedSec)}</div>
      </div>`;
  }).join('');

  lastAthletes = currentAthletes;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ===== メイン更新 =====
async function refreshBoard() {
  try {
    const data = await jsonp({
      action: 'getResultBoard',
      event: settings.event,
      order: settings.order,
      limit: String(settings.limit)
    });
    if (data.success) {
      renderResults(data.results);
      setConn(true);
    } else {
      setConn(false);
    }
  } catch(e) {
    setConn(false);
  }
}

function setConn(ok) {
  connDot.className = 'conn-dot ' + (ok ? 'ok' : 'err');
  connLabel.textContent = ok ? '接続済' : '未接続';
}

// ===== 種目一覧の自動取得（本日記録のある種目） =====
async function refreshEventList() {
  try {
    const data = await jsonp({ action: 'getRecords', limit: '300' });
    if (!data.success) return;
    const today = todayJST();
    const map = new Map(); // event -> last timestamp(ms)
    data.records.forEach(r => {
      if (r.status === 'invalid') return;
      const d = new Date(r.timestamp);
      if (jstDateStr(d) !== today) return;
      const ev = r.event || '';
      if (!ev) return;
      const ts = d.getTime();
      if (!map.has(ev) || map.get(ev) < ts) map.set(ev, ts);
    });
    const events = [...map.entries()].sort((a, b) => b[1] - a[1]).map(([name]) => name);

    const current = settings.event;
    selEvent.innerHTML = '<option value="">すべて（本日の全種目）</option>' +
      events.map(ev => `<option value="${escapeHtml(ev)}">${escapeHtml(ev)}</option>`).join('');
    selEvent.value = events.includes(current) ? current : current === '' ? '' : current;
    // 選択中の種目が消えた場合はラベルだけ更新（自動で「すべて」には変えない）
    eventLabel.textContent = settings.event || 'すべて';
  } catch(e) {}
}

// ===== 設定パネル操作 =====
document.getElementById('btn-gear').addEventListener('click', () => {
  overlay.classList.add('show');
  settingsEl.classList.add('show');
});
function closeSettings() {
  overlay.classList.remove('show');
  settingsEl.classList.remove('show');
}
document.getElementById('btn-close').addEventListener('click', closeSettings);
overlay.addEventListener('click', closeSettings);

selEvent.addEventListener('change', () => {
  settings.event = selEvent.value;
  eventLabel.textContent = settings.event || 'すべて';
  saveSettings();
  refreshBoard();
});

btnAsc.addEventListener('click', () => {
  settings.order = 'asc';
  applySettingsToUI();
  saveSettings();
  refreshBoard();
});
btnDesc.addEventListener('click', () => {
  settings.order = 'desc';
  applySettingsToUI();
  saveSettings();
  refreshBoard();
});

inpLimit.addEventListener('change', () => {
  let v = parseInt(inpLimit.value) || 20;
  v = Math.max(3, Math.min(30, v));
  inpLimit.value = v;
  settings.limit = v;
  saveSettings();
  refreshBoard();
});

// ===== 初期化 & ポーリング =====
refreshEventList();
refreshBoard();
setInterval(refreshBoard, 3000);
setInterval(refreshEventList, 15000);
</script>
</body>
</html>
