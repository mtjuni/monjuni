<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RESULT – モンジュニ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&display=swap');
:root{--bg:#0a0a0f;--surface:#13131a;--border:#1e1e2e;--accent:#00ff88;--accent2:#ff3366;--warn:#ffaa00;--gold:#ffd700;--silver:#c8d0e0;--bronze:#cd7f32;--text:#e8e8f0;--text-dim:#666680;--tf:'Bebas Neue',sans-serif;--bf:'Noto Sans JP',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--bf);display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,255,136,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,0.025) 1px,transparent 1px);background-size:40px 40px;}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;gap:10px;}
.hdr-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
.hdr-title{font-family:var(--tf);font-size:1.4rem;letter-spacing:5px;color:var(--accent);flex-shrink:0;}
.hdr-event{font-size:0.95rem;font-weight:700;padding:3px 12px;border:1px solid var(--border);border-radius:20px;background:var(--bg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.hdr-badge{font-size:0.65rem;color:var(--text-dim);letter-spacing:2px;border:1px solid var(--border);border-radius:12px;padding:2px 8px;white-space:nowrap;}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.conn-wrap{display:flex;align-items:center;gap:5px;font-size:0.7rem;color:var(--text-dim);}
.conn-dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);}
.conn-dot.ok{background:var(--accent);box-shadow:0 0 5px var(--accent);}
.conn-dot.err{background:var(--accent2);}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:7px;width:36px;height:36px;font-size:1rem;cursor:pointer;flex-shrink:0;}
.icon-btn.edit-on{border-color:var(--accent2);color:var(--accent2);background:rgba(255,51,102,0.08);}
.edit-banner{display:none;text-align:center;font-size:0.75rem;letter-spacing:2px;color:var(--accent2);background:rgba(255,51,102,0.08);border-bottom:1px solid var(--accent2);padding:5px;flex-shrink:0;}
body.edit-mode .edit-banner{display:block;}
.main{flex:1;display:flex;min-height:0;gap:1px;background:var(--border);}
.col{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0;}
.col-hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.col-title{font-family:var(--tf);font-size:1rem;letter-spacing:3px;color:var(--accent);}
.col-sub{font-size:0.62rem;color:var(--warn);}
.col-body{flex:1;display:flex;flex-direction:column;padding:8px;gap:6px;overflow:hidden;min-height:0;}
.row{flex:1 1 0;min-height:0;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 14px;transition:background 0.3s,border-color 0.3s;cursor:default;}
body.edit-mode .row{cursor:pointer;}
body.edit-mode .row:active{border-color:var(--accent2);background:rgba(255,51,102,0.1);}
.row.flash{animation:flash 0.7s ease;}
@keyframes flash{0%{background:rgba(0,255,136,0.3);}100%{background:var(--surface);}}
.row.r1{border-color:var(--gold);background:linear-gradient(90deg,rgba(255,215,0,0.09),var(--surface));}
.row.r2{border-color:var(--silver);background:linear-gradient(90deg,rgba(200,208,224,0.07),var(--surface));}
.row.r3{border-color:var(--bronze);background:linear-gradient(90deg,rgba(205,127,50,0.07),var(--surface));}
.r-rank{font-family:var(--tf);font-size:clamp(1.1rem,4.5vh,2.8rem);color:var(--text-dim);width:1.5em;text-align:center;flex-shrink:0;}
.row.r1 .r-rank{color:var(--gold);}.row.r2 .r-rank{color:var(--silver);}.row.r3 .r-rank{color:var(--bronze);}
.r-info{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;}
.r-name{font-weight:900;font-size:clamp(1rem,3.8vh,2.2rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.r-grade{font-size:clamp(0.6rem,1.6vh,0.9rem);color:var(--text-dim);border:1px solid var(--border);border-radius:8px;padding:1px 7px;flex-shrink:0;white-space:nowrap;}
.r-time{font-family:var(--tf);font-size:clamp(1.2rem,5vh,3rem);color:var(--accent);letter-spacing:2px;flex-shrink:0;}
.row.r1 .r-time{color:var(--gold);}.row.r2 .r-time{color:var(--silver);}.row.r3 .r-time{color:var(--bronze);}
.r-del{display:none;font-size:1.1rem;color:var(--accent2);flex-shrink:0;}
body.edit-mode .r-del{display:block;}
.empty-msg{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:0.9rem;text-align:center;line-height:1.8;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;z-index:90;}
.overlay.show{display:block;}
.panel{position:fixed;top:0;right:0;height:100%;width:min(420px,92vw);background:var(--surface);border-left:1px solid var(--border);transform:translateX(100%);transition:transform 0.25s ease;z-index:100;display:flex;flex-direction:column;}
.panel.show{transform:translateX(0);}
.panel-hdr{padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.panel-hdr h2{font-family:var(--tf);letter-spacing:3px;color:var(--accent);font-size:1.1rem;}
.panel-close{background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:6px;width:30px;height:30px;font-size:0.9rem;cursor:pointer;}
.panel-body{flex:1;overflow-y:auto;padding:14px 18px;}
.s-label{font-size:0.62rem;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;margin:14px 0 6px;}
.s-row{display:flex;gap:6px;flex-wrap:wrap;}
.s-btn{padding:8px 12px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--text-dim);font-family:var(--bf);font-size:0.8rem;font-weight:700;cursor:pointer;white-space:nowrap;}
.s-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,255,136,0.07);}
.s-select{width:100%;padding:9px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:7px;font-family:var(--bf);font-size:0.88rem;}
.s-input{width:100%;padding:9px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:7px;font-size:0.88rem;font-family:var(--bf);}
.s-hint{font-size:0.62rem;color:var(--text-dim);margin-top:4px;line-height:1.6;}
.s-divider{border:none;border-top:1px solid var(--border);margin:16px 0;}
.col-cfg{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;}
.col-cfg-title{font-size:0.7rem;color:var(--accent);letter-spacing:2px;margin-bottom:8px;font-weight:700;}
.confirm-wrap{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:110;}
.confirm-wrap.show{display:flex;}
.confirm-box{background:var(--surface);border:1px solid var(--accent2);border-radius:12px;padding:22px;width:min(340px,85vw);text-align:center;}
.confirm-box .ct{font-size:0.65rem;letter-spacing:3px;color:var(--accent2);margin-bottom:8px;}
.confirm-box .cn{font-weight:900;font-size:1.4rem;margin-bottom:3px;}
.confirm-box .cd{font-family:var(--tf);font-size:1.2rem;color:var(--text-dim);margin-bottom:16px;}
.confirm-row{display:flex;gap:8px;}
.c-btn{flex:1;padding:12px;border-radius:7px;border:none;font-weight:700;font-size:0.9rem;cursor:pointer;font-family:var(--bf);}
.c-btn.cancel{background:var(--bg);color:var(--text-dim);border:1px solid var(--border);}
.c-btn.del{background:var(--accent2);color:#fff;}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-title">&#127942; RESULT</div>
    <div class="hdr-event" id="hdr-event">&#x2014;</div>
    <div class="hdr-badge" id="hdr-order">速い順</div>
  </div>
  <div class="hdr-right">
    <div class="conn-wrap"><span class="conn-dot" id="conn-dot"></span><span id="conn-lbl">接続中...</span></div>
    <button class="icon-btn" id="btn-edit" title="編集モード">&#9999;</button>
    <button class="icon-btn" id="btn-gear" title="設定">&#9881;</button>
  </div>
</div>
<div class="edit-banner">&#9999; 編集モード &#x2014; 記録をタップして無効化できます</div>
<div class="main" id="main"></div>
<div class="overlay" id="overlay"></div>
<div class="panel" id="panel">
  <div class="panel-hdr">
    <h2>&#9881; 表示設定</h2>
    <button class="panel-close" id="panel-close">&#x2715;</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</div>
<div class="confirm-wrap" id="confirm-wrap">
  <div class="confirm-box">
    <div class="ct">この記録を無効にしますか？</div>
    <div class="cn" id="cfm-name">&#x2014;</div>
    <div class="cd" id="cfm-time">&#x2014;</div>
    <div class="confirm-row">
      <button class="c-btn cancel" id="cfm-cancel">キャンセル</button>
      <button class="c-btn del" id="cfm-ok">無効にする</button>
    </div>
  </div>
</div>
<script>
const GAS="https://script.google.com/macros/s/AKfycbyAYCCjc_uun-LUW58wEInEXVOS4RvVKRDflVMHYbd4kb1GhP3hXfjC472OOsRHkBep/exec";
const POLL_MS=3000,EV_MS=15000;
const DEF={event:'',order:'asc',limit:15,layoutCols:3,columns:[{label:'\u7DCF\u5408',gender:'',grade:''},{label:'\u7537\u5B50',gender:'male',grade:''},{label:'\u5973\u5B50',gender:'female',grade:''}]};
let cfg=(()=>{try{const r=localStorage.getItem('mjResultCfg');if(r){const p=JSON.parse(r);return{...DEF,...p,columns:p.columns||DEF.columns.map(c=>({...c}))}}}catch(e){}return{...DEF,columns:DEF.columns.map(c=>({...c}))}})();
function saveCfg(){try{localStorage.setItem('mjResultCfg',JSON.stringify(cfg))}catch(e){}}
let editMode=false,grades=[],eventList=[],pendingDel=null,lastTops=[],polling=null;
function jsonp(p){return new Promise((res,rej)=>{const cb='__cb_'+Math.random().toString(36).slice(2),sc=document.createElement('script');let done=false;const cl=()=>{delete window[cb];sc.remove()};window[cb]=d=>{done=true;cl();res(d)};sc.src=GAS+'?'+new URLSearchParams({...p,callback:cb});sc.onerror=()=>{if(!done){cl();rej(new Error('net'))}};document.body.appendChild(sc);setTimeout(()=>{if(!done){cl();rej(new Error('timeout'))}},9000)})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtTime(sec){if(sec==null||isNaN(sec))return'--.--';if(sec>=60){const m=Math.floor(sec/60),s=sec-m*60;return`${m}:${s.toFixed(2).padStart(5,'0')}`}return Number(sec).toFixed(2)}
function jstDateStr(d){return new Date(new Date(d).getTime()+9*3600000).toISOString().slice(0,10)}
const mainEl=document.getElementById('main'),hdrEvent=document.getElementById('hdr-event'),hdrOrder=document.getElementById('hdr-order'),connDot=document.getElementById('conn-dot'),connLbl=document.getElementById('conn-lbl'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),panelBody=document.getElementById('panel-body'),confirmW=document.getElementById('confirm-wrap'),cfmName=document.getElementById('cfm-name'),cfmTime=document.getElementById('cfm-time');
function setConn(ok){connDot.className='conn-dot '+(ok?'ok':'err');connLbl.textContent=ok?'\u63A5\u7D9A\u6E08':'\u672A\u63A5\u7D9A'}
function updateHeader(){hdrEvent.textContent=cfg.event||'\u3059\u3079\u3066\u306E\u7A2E\u76EE';hdrOrder.textContent=cfg.order==='asc'?'\u901F\u3044\u9806':'\u9577\u3044\u9806'}
function colLabel(i){return['\u7DCF\u5408','\u7537\u5B50','\u5973\u5B50','\u52174','\u52175'][i]||`\u5217${i+1}`}
function buildLayout(){
  const n=cfg.layoutCols;
  while(cfg.columns.length<n)cfg.columns.push({label:'',gender:'',grade:''});
  lastTops=new Array(n).fill('');mainEl.innerHTML='';
  for(let i=0;i<n;i++){
    const col=document.createElement('div');col.className='col';
    col.innerHTML=`<div class="col-hdr"><span class="col-title" id="col-title-${i}">${esc(cfg.columns[i].label||colLabel(i))}</span><span class="col-sub" id="col-sub-${i}"></span></div><div class="col-body" id="col-body-${i}"><div class="empty-msg">\u8AAD\u307F\u8FBC\u307F\u4E2D...</div></div>`;
    mainEl.appendChild(col);
    col.querySelector('.col-body').addEventListener('click',e=>{
      if(!editMode)return;const row=e.target.closest('.row');if(!row||!row.dataset.ts)return;
      pendingDel={athleteId:row.dataset.aid,athleteName:row.dataset.name,timestamp:row.dataset.ts,timeStr:row.dataset.time};
      cfmName.textContent=pendingDel.athleteName;cfmTime.textContent=`${pendingDel.timeStr}\u3000(${pendingDel.timestamp})`;confirmW.classList.add('show');
    });
  }
  updateHeader();
}
function renderCol(i,results){
  const body=document.getElementById('col-body-'+i);if(!body)return;
  if(!results||!results.length){body.innerHTML='<div class="empty-msg">\u8A18\u9332\u306A\u3057</div>';lastTops[i]='';return}
  const prev=lastTops[i],newTop=results[0].athleteName,isNew=prev!==''&&prev!==newTop;lastTops[i]=newTop;
  body.innerHTML=results.map(r=>{
    const rc=r.rank===1?'r1':r.rank===2?'r2':r.rank===3?'r3':'',fl=(isNew&&r.rank===1)?'flash':'';
    const grade=r.grade?`<span class="r-grade">${esc(r.grade)}</span>`:'';
    return`<div class="row ${rc} ${fl}" data-aid="${esc(r.athleteId||'')}" data-name="${esc(r.athleteName)}" data-ts="${esc(r.timestamp||'')}" data-time="${fmtTime(r.elapsedSec)}"><div class="r-rank">${r.rank}</div><div class="r-info"><div class="r-name">${esc(r.athleteName)}</div>${grade}</div><div class="r-time">${fmtTime(r.elapsedSec)}</div><div class="r-del">&#x1F5D1;</div></div>`;
  }).join('');
  const sub=document.getElementById('col-sub-'+i);
  if(sub){const unk=results.filter(r=>!r.grade).length;sub.textContent=unk>0?`\u26A0 \u6027\u5225\u672A\u767B\u9332: ${unk}\u540D`:''}
}
async function refresh(){
  const n=cfg.layoutCols;
  const ps=Array.from({length:n},(_,i)=>{const cc=cfg.columns[i]||{};return jsonp({action:'getResultBoard',event:cfg.event,order:cfg.order,limit:String(cfg.limit),gender:cc.gender||'',grade:cc.grade||''}).then(d=>({i,d})).catch(()=>({i,d:null}))});
  const res=await Promise.all(ps);let ok=false;
  res.forEach(({i,d})=>{if(d&&d.success){renderCol(i,d.results);ok=true}else renderCol(i,[])});
  setConn(ok);
}
function startPolling(){if(polling)clearInterval(polling);refresh();polling=setInterval(refresh,POLL_MS)}
async function loadEventList(){
  try{const d=await jsonp({action:'getRecords',limit:'300'});if(!d.success)return;
  const today=jstDateStr(new Date()),map=new Map();
  d.records.forEach(r=>{if(r.status==='invalid'||!r.event)return;if(jstDateStr(r.timestamp)!==today)return;const ts=new Date(r.timestamp).getTime();if(!map.has(r.event)||map.get(r.event)<ts)map.set(r.event,ts)});
  eventList=[...map.entries()].sort((a,b)=>b[1]-a[1]).map(([name])=>name)}catch(e){}
}
async function loadGrades(){try{const d=await jsonp({action:'getGrades'});if(d.success)grades=d.grades||[]}catch(e){}}
function buildPanel(){
  const n=cfg.layoutCols;while(cfg.columns.length<n)cfg.columns.push({label:'',gender:'',grade:''});
  const evOpts=['',...eventList].map(ev=>`<option value="${esc(ev)}"${cfg.event===ev?' selected':''}>${ev||'\u3059\u3079\u3066\uFF08\u672C\u65E5\u306E\u5168\u7A2E\u76EE\uFF09'}</option>`).join('');
  let colHtml='';
  for(let i=0;i<n;i++){
    const cc=cfg.columns[i]||{};
    const grOpts=['',...grades].map(g=>`<option value="${esc(g)}"${(cc.grade||'')===g?' selected':''}>${g||'\u3059\u3079\u3066\u306E\u5B66\u5E74'}</option>`).join('');
    colHtml+=`<div class="col-cfg"><div class="col-cfg-title">\u5217 ${i+1}</div>
    <div class="s-label" style="margin-top:0">\u30E9\u30D9\u30EB</div><input class="s-input col-label" data-col="${i}" type="text" placeholder="\u4F8B\uFF1A\u7537\u5B50" value="${esc(cc.label||'')}">
    <div class="s-label">\u6027\u5225\u30D5\u30A3\u30EB\u30BF</div><div class="s-row">
    <button class="s-btn col-gender${(cc.gender||'')===''?' active':''}" data-col="${i}" data-v="">\u6DF7\u5408</button>
    <button class="s-btn col-gender${cc.gender==='male'?' active':''}" data-col="${i}" data-v="male">\u7537\u5B50</button>
    <button class="s-btn col-gender${cc.gender==='female'?' active':''}" data-col="${i}" data-v="female">\u5973\u5B50</button></div>
    <div class="s-label">\u5B66\u5E74\u30D5\u30A3\u30EB\u30BF</div><select class="s-select col-grade" data-col="${i}">${grOpts}</select></div>`;
  }
  panelBody.innerHTML=`
  <div class="s-label">\u30EC\u30A4\u30A2\u30A6\u30C8\uFF08\u5217\u6570\uFF09</div>
  <div class="s-row">${[1,2,3].map(v=>`<button class="s-btn layout-btn${cfg.layoutCols===v?' active':''}" data-v="${v}">${v}\u5217</button>`).join('')}</div>
  <hr class="s-divider">
  <div class="s-label">\u7A2E\u76EE</div><select class="s-select" id="sel-event">${evOpts}</select>
  <div class="s-hint">\u672C\u65E5\u8A18\u9332\u306E\u3042\u308B\u7A2E\u76EE\u304B\u3089\u81EA\u52D5\u53D6\u5F97\u3002</div>
  <div class="s-label">\u4E26\u3073\u9806</div><div class="s-row">
  <button class="s-btn${cfg.order==='asc'?' active':''}" id="btn-asc">&#x23F1; \u901F\u3044\u9806\uFF08\u77ED\u3044\uFF09</button>
  <button class="s-btn${cfg.order==='desc'?' active':''}" id="btn-desc">&#x23F3; \u9577\u3044\u9806\uFF08\u8010\u4E45\uFF09</button></div>
  <div class="s-label">\u6700\u5927\u8868\u793A\u4EF6\u6570</div><input class="s-input" id="inp-limit" type="number" min="3" max="30" value="${cfg.limit}">
  <div class="s-hint">\u753B\u9762\u30B5\u30A4\u30BA\u3067\u5B9F\u969B\u306E\u8868\u793A\u884C\u6570\u304C\u6C7A\u307E\u308A\u307E\u3059\u3002</div>
  <hr class="s-divider"><div class="s-label">\u5217\u3054\u3068\u306E\u8A2D\u5B9A</div>${colHtml}`;
  panelBody.querySelectorAll('.layout-btn').forEach(b=>b.addEventListener('click',()=>{cfg.layoutCols=parseInt(b.dataset.v);saveCfg();buildLayout();buildPanel();startPolling()}));
  document.getElementById('sel-event').addEventListener('change',e=>{cfg.event=e.target.value;updateHeader();saveCfg();refresh()});
  document.getElementById('btn-asc').addEventListener('click',()=>{cfg.order='asc';saveCfg();updateHeader();refresh();buildPanel()});
  document.getElementById('btn-desc').addEventListener('click',()=>{cfg.order='desc';saveCfg();updateHeader();refresh();buildPanel()});
  document.getElementById('inp-limit').addEventListener('change',e=>{let v=Math.max(3,Math.min(30,parseInt(e.target.value)||15));e.target.value=v;cfg.limit=v;saveCfg();refresh()});
  panelBody.querySelectorAll('.col-label').forEach(inp=>inp.addEventListener('change',()=>{const ci=parseInt(inp.dataset.col);cfg.columns[ci].label=inp.value;const el=document.getElementById('col-title-'+ci);if(el)el.textContent=inp.value||colLabel(ci);saveCfg()}));
  panelBody.querySelectorAll('.col-gender').forEach(b=>b.addEventListener('click',()=>{const ci=parseInt(b.dataset.col);cfg.columns[ci].gender=b.dataset.v;panelBody.querySelectorAll(`.col-gender[data-col="${ci}"]`).forEach(x=>x.classList.toggle('active',x.dataset.v===b.dataset.v));saveCfg();refresh()}));
  panelBody.querySelectorAll('.col-grade').forEach(s=>s.addEventListener('change',()=>{const ci=parseInt(s.dataset.col);cfg.columns[ci].grade=s.value;saveCfg();refresh()}));
}
document.getElementById('btn-gear').addEventListener('click',()=>{buildPanel();overlay.classList.add('show');panel.classList.add('show')});
function closePanel(){overlay.classList.remove('show');panel.classList.remove('show')}
document.getElementById('panel-close').addEventListener('click',closePanel);
overlay.addEventListener('click',closePanel);
document.getElementById('btn-edit').addEventListener('click',()=>{editMode=!editMode;document.body.classList.toggle('edit-mode',editMode);document.getElementById('btn-edit').classList.toggle('edit-on',editMode)});
document.getElementById('cfm-cancel').addEventListener('click',()=>{pendingDel=null;confirmW.classList.remove('show')});
document.getElementById('cfm-ok').addEventListener('click',async()=>{
  if(!pendingDel)return;const t=pendingDel;confirmW.classList.remove('show');pendingDel=null;
  try{const d=await jsonp({action:'deleteRecord',athleteId:t.athleteId,timestamp:t.timestamp});if(d.success)refresh();else alert('\u7121\u52B9\u5316\u3067\u304D\u307E\u305B\u3093\u3067\u3057\u305F: '+(d.error||''))}catch(e){alert('\u901A\u4FE1\u30A8\u30E9\u30FC')}
});
(async()=>{await Promise.all([loadGrades(),loadEventList()]);buildLayout();startPolling();setInterval(loadEventList,EV_MS)})();
